name: Publish SZL invariants source binding

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact protected-main szl-invariants Git revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-szl-invariants
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize protected source without publisher secret
    outputs:
      publisher_revision: ${{ steps.resolve_publisher_revision.outputs.publisher_revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout trusted Forge gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact invariants source as untrusted test input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-invariants
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted gateway test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.26.0"

      - name: Test trusted invariants gateway contracts
        env:
          PYTHONPATH: tools
        run: >-
          python -m unittest -v
          tools/test_authorize_invariants_release.py
          tools/test_publish_szl_invariants.py

      - name: Test untrusted source publication contract without publisher secret
        run: python -m unittest -v source/tests/test_publication_contract.py

      - name: Resolve protected publisher revision
        id: resolve_publisher_revision
        run: |
          set -euo pipefail
          publisher_revision="$(git -C . ls-remote https://github.com/szl-holdings/szl-forge.git refs/heads/main | awk '{print $1}')"
          if [ -z "$publisher_revision" ]; then
            echo "Failed to resolve szl-forge main revision" >&2
            exit 1
          fi
          echo "publisher_revision=$publisher_revision" >> "$GITHUB_OUTPUT"

      - name: Wait for exact protected-main source gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER_REVISION: ${{ steps.resolve_publisher_revision.outputs.publisher_revision }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: >-
          python tools/authorize_invariants_release.py
          --source-revision "${SOURCE_REVISION}"
          --publisher-revision "${PUBLISHER_REVISION}"
          --wait-seconds 900
          --report reports/invariants-release-authorization.json

      - name: Upload non-secret authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invariants-release-authorization-${{ github.run_id }}
          path: reports/invariants-release-authorization.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish with trusted Forge code and verify exact readback
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout trusted Forge publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout authorized invariants source as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-invariants
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication client without publisher secret
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "huggingface-hub==1.26.0"
          cargo install --locked \
            --git https://github.com/huggingface/kernels \
            --rev 633246310320d85def0c67d62c7912fd444a842f \
            hf-kernel-builder
          test "$(kernel-builder --version)" = "hf-kernel-builder 0.17.0-dev0"

      - name: Download canonical authorization evidence
        uses: actions/download-artifact@5b8c2fce2f9e5ebc9ebcde2fbe5f0a9f7f9a7e56 # v5.0.0
        with:
          name: invariants-release-authorization-${{ github.run_id }}
          path: reports

      - name: Read canonical authorization evidence
        id: authorization
        run: |
          set -euo pipefail
          test -s reports/invariants-release-authorization.json
          report_publisher_revision="$(jq -r '.publisher.revision' reports/invariants-release-authorization.json)"
          source_revision="$(jq -r '.source.revision' reports/invariants-release-authorization.json)"
          status="$(jq -r '.status' reports/invariants-release-authorization.json)"
          test -n "$report_publisher_revision"
          test -n "$source_revision"
          test "$report_publisher_revision" = "${{ needs.authorize.outputs.publisher_revision }}"
          test "$status" = "AUTHORIZED_PROTECTED_MAIN"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

      - name: Verify requested source revision matches authorization evidence
        run: test "${{ inputs.source_revision }}" = "${{ steps.authorization.outputs.source_revision }}"

      - name: Publish declared Python with trusted code and verify exact readback
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          SOURCE_REVISION: ${{ steps.authorization.outputs.source_revision }}
          PUBLISHER_REVISION: ${{ needs.authorize.outputs.publisher_revision }}
        run: >-
          python tools/publish_szl_invariants.py
          --source-dir source
          --source-revision "${SOURCE_REVISION}"
          --authorization-report reports/invariants-release-authorization.json
          --publisher-repository "${GITHUB_REPOSITORY}"
          --publisher-revision "${PUBLISHER_REVISION}"
          --publisher-workflow-ref "${GITHUB_WORKFLOW_REF}"
          --publisher-run-id "${GITHUB_RUN_ID}"
          --publisher-run-attempt "${GITHUB_RUN_ATTEMPT}"
          --publish
          --report reports/invariants-publication.json

      - name: Upload immutable publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invariants-publication-${{ github.run_id }}
          path: |
            reports/invariants-release-authorization.json
            reports/invariants-publication.json
          if-no-files-found: error
          retention-days: 90
