name: RLT continuity research
on:
  pull_request:
    paths: ['frontier/rlt/**', '.github/workflows/rlt-continuity.yml']
  push:
    branches: [main]
    paths: ['frontier/rlt/**', '.github/workflows/rlt-continuity.yml']
permissions:
  contents: read
jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared CPU research package
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ./frontier/rlt pytest==9.0.2 build==1.3.0
          python -m pip check
      - name: Contract and tensor tests
        run: python -m pytest frontier/rlt/tests -q
      - name: Build and install the wheel
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/rlt-dist" frontier/rlt
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/rlt-dist/*.whl
          python -m pip check
      - name: Installed-mode execution outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import frontier.rlt, os; assert not os.path.realpath(frontier.rlt.__file__).startswith(os.environ["GITHUB_WORKSPACE"] + os.sep)'
          szl-rlt-research --output "$RUNNER_TEMP/rlt-measured-run"
