name: Model and kernel frontier verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: model-kernel-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Receipts, source contracts, and portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install verification-only dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "cryptography==49.0.0"
          "fastapi==0.139.0"
          "httpx==0.28.1"
          "huggingface-hub==1.23.0"
          "jsonschema==4.26.0"
          "pydantic==2.13.4"
          "safetensors==0.8.0"

      - name: Compile and run offline contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/authorize_kernels_release.py \
            tools/test_authorize_kernels_release.py \
            tools/publish_szl_kernels.py \
            tools/test_publish_szl_kernels.py \
            tools/authorize_invariants_release.py \
            tools/test_authorize_invariants_release.py \
            tools/publish_szl_invariants.py \
            tools/test_publish_szl_invariants.py \
            tools/publish_model_source_bindings.py \
            tools/test_publish_model_source_bindings.py \
            tools/test_model_binding_workflow.py \
            tools/test_model_kernel_frontier_workflow.py \
            tools/publish_hf_space.py \
            tools/test_publish_hf_space.py \
            tools/verify_model_portfolio.py \
            tools/test_verify_model_portfolio.py \
            spaces/szl-model-inference-lab/app.py \
            spaces/szl-model-inference-lab/download_artifacts.py \
            spaces/szl-model-inference-lab/verify_execution_record.py \
            spaces/szl-forge-lab/forge_lab.py \
            spaces/szl-forge-lab/forge_runtime_contract.py \
            frontier/qwen35-receiptagent-v2/qualify_runtime.py \
            frontier/qwen35-receiptagent-v2/train_candidate.py \
            frontier/qwen35-receiptagent-v2/evaluate_candidate.py \
            frontier/qwen35-receiptagent-v2/evidence_chain.py \
            frontier/qwen35-receiptagent-v3/generate_curriculum.py \
            frontier/qwen35-receiptagent-v3/qualify_runtime.py \
            frontier/qwen35-receiptagent-v3/containment_probe.py \
            frontier/qwen35-receiptagent-v3/launch_supervised_training.py \
            frontier/qwen35-receiptagent-v3/supervise_training.py \
            frontier/qwen35-receiptagent-v3/supervisor_bootstrap.py \
            frontier/qwen35-receiptagent-v3/supervisor_validation.py \
            frontier/qwen35-receiptagent-v3/train_candidate.py \
            frontier/qwen35-receiptagent-v3/evaluate_candidate.py \
            frontier/qwen35-receiptagent-v3/compare_reports.py \
            frontier/qwen35-receiptagent-v3/evidence_chain.py \
            frontier/qwen35-receiptagent-v3/prepare_release.py \
            frontier/qwen35-receiptagent-v3/test_contract.py \
            frontier/qwen35-receiptagent-v3/test_evidence_chain.py \
            frontier/qwen35-receiptagent-v3/test_launch_supervised_training.py \
            frontier/qwen35-receiptagent-v3/test_prepare_release.py \
            frontier/qwen35-receiptagent-v3/test_supervise_training.py \
            frontier/qwen35-receiptagent-v3/test_supervisor_validation.py \
            tools/publish_receiptagent_v3.py \
            tools/test_publish_receiptagent_v3.py \
            chaski/train_chaski.py \
            chaski/eval_chaski.py \
            chaski/bakeoff_named_n.py \
            chaski/test_bakeoff_named_n.py \
            chaski/serve_chaski.py \
            chaski/jobs/launch_chaski_job.py \
            qantu/skip_receipt.py \
            waman/skip_receipt.py \
            chakana/train_chakana.py \
            chakana/eval_chakana.py \
            chakana/serve_chakana.py \
            chakana/jobs/launch_chakana_job.py \
            chakana/sign_receipt.py \
            tinku/train_tinku.py \
            khipu/serve_khipu.py \
            khipu_r2/train_khipu_r2.py \
            khipu_r2/eval_khipu_r2.py \
            khipu_r2/serve_khipu_r2.py \
            khipu_r2/jobs/launch_khipu_r2_job.py \
            chaski_r2/train_chaski_r2.py \
            chaski_r2/eval_chaski_r2.py \
            chaski_r2/serve_chaski_r2.py \
            chaski_r2/jobs/launch_chaski_r2_job.py \
            receiptagent/serve_receiptagent.py \
            frontier/qwen35-receiptagent-v2/serve_candidate.py
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema.validators import validator_for

          for schema_path in (
              Path("frontier/qwen35-receiptagent-v3/schemas/authenticated-receipt.schema.json"),
              Path("frontier/qwen35-receiptagent-v3/release.schema.json"),
          ):
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              if not isinstance(schema, dict):
                  raise TypeError(f"{schema_path} must contain one JSON object")
              validator_for(schema).check_schema(schema)
          PY
          python tools/test_verify_model_portfolio.py
          PYTHONPATH=. python -m unittest -v tools/test_fall2026_alignment.py
          PYTHONPATH=. python -m unittest -v chaski/test_named_n_gate.py
          PYTHONPATH=. python -m unittest -v chaski/test_bakeoff_named_n.py
          PYTHONPATH=. python -m unittest -v khipu_r2/test_khipu_r2.py
          PYTHONPATH=. python -m unittest -v chaski_r2/test_chaski_r2.py
          PYTHONPATH=. python -m unittest -v chakana/test_chakana.py
          PYTHONPATH=tools python -m unittest -v \
            tools/test_authorize_kernels_release.py \
            tools/test_publish_szl_kernels.py
          PYTHONPATH=tools python -m unittest -v \
            tools/test_authorize_invariants_release.py \
            tools/test_publish_szl_invariants.py
          PYTHONPATH=tools python tools/test_publish_model_source_bindings.py
          python tools/test_model_binding_workflow.py
          python tools/test_model_kernel_frontier_workflow.py
          PYTHONPATH=tools python tools/test_publish_hf_space.py
          PYTHONPATH=frontier/qwen35-receiptagent-v2 \
            python frontier/qwen35-receiptagent-v2/test_qualify_runtime.py
          python frontier/qwen35-receiptagent-v2/evidence_chain.py verify
          python frontier/qwen35-receiptagent-v3/generate_curriculum.py --check
          PYTHONPATH=frontier/qwen35-receiptagent-v3 \
            python -m unittest discover \
              -s frontier/qwen35-receiptagent-v3 \
              -p 'test_*.py' -v
          PYTHONPATH=tools \
            python -m unittest -v tools/test_publish_receiptagent_v3.py
          PYTHONPATH=spaces/szl-model-inference-lab \
            python -m unittest discover \
              -s spaces/szl-model-inference-lab/tests -v
          PYTHONPATH=spaces/szl-forge-lab \
            python -m unittest discover \
              -s spaces/szl-forge-lab/tests -v
          python tools/verify_model_portfolio.py --offline
          python tools/publish_hf_space.py \
            --source-dir spaces/szl-model-inference-lab \
            --repo-id SZLHOLDINGS/szl-model-inference-lab \
            --source-revision "${GITHUB_SHA}" \
            --report reports/model-inference-lab-dry-run.json
          python tools/publish_hf_space.py \
            --source-dir spaces/szl-forge-lab \
            --repo-id SZLHOLDINGS/szl-forge-lab \
            --source-revision "${GITHUB_SHA}" \
            --static \
            --report reports/szl-forge-lab-dry-run.json
          git diff --check

      - name: Build the stable Kernel runtime image
        run: docker build --pull -t szl-kernel-runtime:0.16.0 -f tools/kernel-runtime.Dockerfile .

      - name: Verify isolated failure evidence round trip
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from publish_szl_kernels import PublicationError, verify_stable_kernel_runtime_isolated

          try:
              verify_stable_kernel_runtime_isolated(revision="0" * 40)
          except PublicationError as exc:
              detail = str(exc)
              if "exited without evidence" in detail:
                  raise SystemExit(detail)
              if not detail.startswith("isolated stable Kernel runtime failed:"):
                  raise SystemExit(detail)
          else:
              raise SystemExit("invalid revision unexpectedly passed isolated runtime verification")
          PY

      - name: Acquire validated private-Hub read credential
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/acquire_hf_publisher_token.py \
            --target-repo SZLHOLDINGS/SZL-Forge-1.5B-ReceiptAgent \
            --target-type model \
            --github-env "${GITHUB_ENV}" \
            --report reports/hf-private-read-credential.json

      - name: Audit exact gated bindings and public portfolio
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python tools/publish_model_source_bindings.py \
            --source-revision "${GITHUB_SHA}" \
            --report reports/model-source-bindings-dry-run.json
          python tools/verify_model_portfolio.py \
            --live \
            --report reports/model-portfolio-live.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-kernel-portfolio-${{ github.run_id }}
          path: |
            reports/model-portfolio-live.json
            reports/model-source-bindings-dry-run.json
            reports/hf-private-read-credential.json
          if-no-files-found: warn
          retention-days: 30

  verify-receiptagent-v3-windows:
    name: ReceiptAgent v3 authenticated release (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ReceiptAgent v3 verification dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check `
            "cryptography==49.0.0" `
            "huggingface-hub==1.23.0" `
            "jsonschema==4.26.0"
          if ($LASTEXITCODE -ne 0) {
            throw "dependency installation failed with exit code $LASTEXITCODE"
          }

      - name: Compile and run ReceiptAgent v3 authenticated release contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-CheckedPython {
            & python @args
            if ($LASTEXITCODE -ne 0) {
              throw "python command failed with exit code $LASTEXITCODE"
            }
          }

          Invoke-CheckedPython -B -m py_compile `
            frontier/qwen35-receiptagent-v3/evidence_chain.py `
            frontier/qwen35-receiptagent-v3/prepare_release.py `
            frontier/qwen35-receiptagent-v3/test_evidence_chain.py `
            frontier/qwen35-receiptagent-v3/test_prepare_release.py `
            tools/publish_receiptagent_v3.py `
            tools/test_publish_receiptagent_v3.py

          @'
          import json
          from pathlib import Path

          from jsonschema.validators import validator_for

          for schema_path in (
              Path("frontier/qwen35-receiptagent-v3/schemas/authenticated-receipt.schema.json"),
              Path("frontier/qwen35-receiptagent-v3/release.schema.json"),
          ):
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              if not isinstance(schema, dict):
                  raise TypeError(f"{schema_path} must contain one JSON object")
              validator_for(schema).check_schema(schema)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) {
            throw "schema validation failed with exit code $LASTEXITCODE"
          }

          $env:PYTHONPATH = "frontier/qwen35-receiptagent-v3"
          Invoke-CheckedPython -B -m unittest -v `
            frontier/qwen35-receiptagent-v3/test_evidence_chain.py `
            frontier/qwen35-receiptagent-v3/test_prepare_release.py

          $env:PYTHONPATH = "tools"
          Invoke-CheckedPython -B -m unittest -v tools/test_publish_receiptagent_v3.py

          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed with exit code $LASTEXITCODE"
          }
