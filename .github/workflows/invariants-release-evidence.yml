name: Invariants release evidence contract
on:
  pull_request:
    paths:
      - tools/inspect_invariants_release_evidence.py
      - tests/test_invariants_release_evidence.py
      - docs/invariants-release-evidence.md
      - .github/workflows/invariants-release-evidence.yml
  push:
    branches: [main]
    paths:
      - tools/inspect_invariants_release_evidence.py
      - tests/test_invariants_release_evidence.py
      - docs/invariants-release-evidence.md
      - .github/workflows/invariants-release-evidence.yml
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline evidence contract
        run: python -m unittest discover -s tests -p test_invariants_release_evidence.py -v
      - name: Repeat with optimized interpreter
        run: python -O -m unittest discover -s tests -p test_invariants_release_evidence.py -v
