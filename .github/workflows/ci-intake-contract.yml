name: Offline CI intake contract

on:
  pull_request:
    paths:
      - 'tools/ci-intake/**'
      - '.github/workflows/ci-intake-contract.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ci-intake/**'
      - '.github/workflows/ci-intake-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify synthetic intake contracts and expected refusal
        run: python -I -B -S tools/ci-intake/run_checks.py > ci-intake-checks.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-intake-python-${{ matrix.python }}
          path: ci-intake-checks.json
          if-no-files-found: error
          retention-days: 30
