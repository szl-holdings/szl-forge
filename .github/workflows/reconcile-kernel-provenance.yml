name: Reconcile kernel provenance

on:
  pull_request:
    paths:
      - 'tools/kernel_provenance_evidence.py'
      - 'tools/reconcile_kernel_provenance.py'
      - 'tests/test_kernel_provenance_evidence.py'
      - 'tests/test_reconcile_kernel_provenance.py'
      - 'publishing/kernel-provenance*/**'
      - 'publishing/kernel-provenance*'
      - '.github/workflows/reconcile-kernel-provenance.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check is read-only; publish replaces one reviewed metadata file on each of eight closed targets.'
        type: choice
        options: [check, publish]
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: szl-kernel-provenance-reconciliation
  cancel-in-progress: false

jobs:
  verify:
    name: Provenance contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline source and publisher contracts
        run: |
          python -B -m unittest discover -s tests -p 'test_kernel_provenance_evidence.py' -v
          python -B -m unittest discover -s tests -p 'test_reconcile_kernel_provenance.py' -v
          python -B tools/reconcile_kernel_provenance.py validate --repo-root .
          git diff --check

  provider:
    name: Explicit provider ${{ inputs.mode }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/kernel-provenance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install publication client
        run: python -m pip install --disable-pip-version-check 'huggingface-hub==1.29.0'
      - name: Create new evidence directory outside immutable source checkout
        run: mkdir "$EVIDENCE_DIR"
      - name: Acquire existing publisher credential only for explicit publish
        if: ${{ inputs.mode == 'publish' }}
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: >-
          python -B tools/acquire_hf_publisher_token.py
          --target-repo SZLHOLDINGS/szl-blocked --target-type model
          --github-env "$GITHUB_ENV" --report "$EVIDENCE_DIR/provenance-credential.json"
      - name: Check all targets or publish reviewed metadata with expected-parent guards
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: |
          set -euo pipefail
          test "$MODE" = check || test "$MODE" = publish
          python -B tools/reconcile_kernel_provenance.py "$MODE" \
            --repo-root . --source-revision "$GITHUB_SHA" \
            --receipt "$EVIDENCE_DIR/provenance-publication.jsonl"
      - name: Retain success, partial, and uncertain outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/provenance-*
          if-no-files-found: error
          retention-days: 90
