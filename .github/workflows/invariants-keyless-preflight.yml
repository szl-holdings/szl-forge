name: Invariants keyless preflight contract
on:
  pull_request:
    paths:
      - tools/invariants_keyless_credentials.py
      - tests/test_invariants_keyless_credentials.py
      - .github/workflows/invariants-keyless-preflight.yml
      - docs/invariants-keyless-preflight.md
  push:
    branches: [main]
    paths:
      - tools/invariants_keyless_credentials.py
      - tests/test_invariants_keyless_credentials.py
      - .github/workflows/invariants-keyless-preflight.yml
      - docs/invariants-keyless-preflight.md
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned client for real SDK transport regressions
        run: python -m pip install --disable-pip-version-check huggingface-hub==1.26.0
      - name: Run offline keyless credential tests
        run: python -m unittest discover -s tests -p test_invariants_keyless_credentials.py -v
      - name: Repeat without assertions enabled
        run: python -O -m unittest discover -s tests -p test_invariants_keyless_credentials.py -v
