name: Repair runtime probe unavailable classification

on:
  push:
    branches:
      - feat/live-governed-inference-space-v2
    paths:
      - .github/workflows/repair-runtime-probe-unavailable.yml

permissions:
  contents: write

concurrency:
  group: repair-runtime-probe-unavailable
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/live-governed-inference-space-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Classify missing runtime as unavailable in dry runs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("tools/publish_model_source_bindings.py")
          test_path = Path("tools/test_publish_model_source_bindings.py")
          workflow_path = Path(
              ".github/workflows/repair-runtime-probe-unavailable.yml"
          )

          source = source_path.read_text(encoding="utf-8")
          class_anchor = '''class TransientBindingError(BindingError):
              """Raised when runtime probe failures are transient and can degrade to no-op runtime evidence."""
          '''
          class_replacement = class_anchor + '''

          class RuntimeUnavailableBindingError(BindingError):
              """Raised when the governed runtime or required route does not exist yet."""
          '''
          if "class RuntimeUnavailableBindingError" not in source:
              if class_anchor not in source:
                  raise SystemExit("runtime unavailable class anchor not found")
              source = source.replace(class_anchor, class_replacement, 1)

          http_anchor = '''        except urllib.error.HTTPError as error:
                      status = error.code
                      if status in transient_statuses and attempt < attempts:
          '''
          http_replacement = '''        except urllib.error.HTTPError as error:
                      status = error.code
                      if status == 404:
                          raise RuntimeUnavailableBindingError(
                              f"runtime probe failed: {url} returned {status}: {error.reason}"
                          ) from error
                      if status in transient_statuses and attempt < attempts:
          '''
          if "if status == 404:" not in source:
              if http_anchor not in source:
                  raise SystemExit("HTTP classification anchor not found")
              source = source.replace(http_anchor, http_replacement, 1)

          catch_anchor = "    except TransientBindingError as error:\n"
          catch_replacement = (
              "    except (TransientBindingError, RuntimeUnavailableBindingError) as error:\n"
          )
          if catch_replacement not in source:
              if catch_anchor not in source:
                  raise SystemExit("runtime probe catch anchor not found")
              source = source.replace(catch_anchor, catch_replacement, 1)

          source_path.write_text(source, encoding="utf-8", newline="\n")

          tests = test_path.read_text(encoding="utf-8")
          test_marker = (
              "    def test_expected_source_rejects_transient_runtime_probe(self) -> None:\n"
          )
          test_block = '''    def test_missing_runtime_route_is_explicitly_not_qualified_in_dry_run(
                  self,
              ) -> None:
                  artifact = {
                      "repo_id": "SZLHOLDINGS/example",
                      "runtime_probe": {"base_url": "https://example.invalid"},
                  }
                  requested: list[str] = []

                  def missing(url: str, payload=None):
                      del payload
                      requested.append(url)
                      raise bindings.RuntimeUnavailableBindingError(
                          "runtime probe returned 404"
                      )

                  evidence = bindings.runtime_evidence(artifact, missing)

                  self.assertEqual(
                      evidence,
                      {
                          "status": "NOT_QUALIFIED_NO_RUNTIME_PROBE",
                          "failure_reason": "runtime probe returned 404",
                          "failure_code": "RUNTIME_SERVICE_UNAVAILABLE",
                      },
                  )
                  self.assertEqual(requested, ["https://example.invalid/health"])

              def test_required_runtime_rejects_missing_route(self) -> None:
                  artifact = {
                      "repo_id": "SZLHOLDINGS/example",
                      "runtime_probe": {"base_url": "https://example.invalid"},
                  }

                  def missing(_url: str, payload=None):
                      del payload
                      raise bindings.RuntimeUnavailableBindingError(
                          "runtime probe returned 404"
                      )

                  with self.assertRaisesRegex(
                      bindings.BindingError,
                      "exact runtime evidence is required but unavailable",
                  ):
                      bindings.runtime_evidence(
                          artifact,
                          missing,
                          require_available=True,
                      )

          '''
          if "test_missing_runtime_route_is_explicitly_not_qualified_in_dry_run" not in tests:
              if test_marker not in tests:
                  raise SystemExit("runtime test insertion marker not found")
              tests = tests.replace(test_marker, test_block + test_marker, 1)
          test_path.write_text(tests, encoding="utf-8", newline="\n")

          workflow_path.unlink()
          PY

      - name: Install exact test dependency
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0"

      - name: Verify exact contract
        shell: bash
        env:
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/publish_model_source_bindings.py \
            tools/test_publish_model_source_bindings.py
          python tools/test_publish_model_source_bindings.py
          git diff --check
          test ! -e .github/workflows/repair-runtime-probe-unavailable.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Forge Release Operator"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit \
            -m "fix(bindings): treat absent governed runtime as unavailable" \
            -m "Allow credentialless dry-run source binding to record a missing Space route as explicit NOT_QUALIFIED evidence while continuing to fail closed whenever publication or exact-runtime evidence is required." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/live-governed-inference-space-v2
