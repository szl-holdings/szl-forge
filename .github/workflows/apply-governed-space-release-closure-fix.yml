name: Apply governed Space release-closure fix

on:
  push:
    branches:
      - feat/live-governed-inference-space-v2
    paths:
      - .github/workflows/apply-governed-space-release-closure-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout exact governed Space branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/live-governed-inference-space-v2
          fetch-depth: 1

      - name: Reconcile the immutable release closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path("spaces/szl-model-inference-lab")
          old_release = "c893e93c-9bd8-47e9-941e-f8613a608992"
          new_release = "6165392a-f3b7-4128-8f77-e37074c2e60d"

          governed = root / "app_governed.py"
          text = governed.read_text(encoding="utf-8")
          replacements = {
              "import hashlib\n": "",
              "from collections.abc import Mapping, Sequence\n": (
                  "from collections.abc import Mapping\n"
              ),
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(
                      f"app_governed precondition failed for {before!r}: "
                      f"{text.count(before)}"
                  )
              text = text.replace(before, after, 1)
          governed.write_text(text, encoding="utf-8", newline="\n")

          verifier = root / "verify_execution_record.py"
          text = verifier.read_text(encoding="utf-8")
          marker = f'EXPECTED_RELEASE_ID = "{old_release}"'
          if text.count(marker) != 1:
              raise SystemExit("legacy execution-record release pin drifted")
          verifier.write_text(
              text.replace(
                  marker,
                  f'EXPECTED_RELEASE_ID = "{new_release}"',
                  1,
              ),
              encoding="utf-8",
              newline="\n",
          )

          bindings = Path("publishing/model-source-bindings.json")
          text = bindings.read_text(encoding="utf-8")
          if text.count(old_release) != 1:
              raise SystemExit(
                  "model-source binding release precondition failed: "
                  f"{text.count(old_release)}"
              )
          bindings.write_text(
              text.replace(old_release, new_release, 1),
              encoding="utf-8",
              newline="\n",
          )

          release_path = root / "release.json"
          release = json.loads(release_path.read_text(encoding="utf-8"))
          if release.get("release_id") != new_release:
              raise SystemExit("release.json does not carry the new immutable id")
          source_files = release.get("source_files")
          if not isinstance(source_files, dict):
              raise SystemExit("release.json source_files is malformed")
          expected_old = {
              "app_governed.py": (
                  "dbeeba8aaff4345ea4d89ce105c5b656bf69f87a629cfd60281d6c9446bd6bbc"
              ),
              "verify_execution_record.py": (
                  "1a64e3c8097409c19d971f711d63fbeb2066e3bfe804da31f684d0b795a529a6"
              ),
          }
          for relative, expected in expected_old.items():
              if source_files.get(relative) != expected:
                  raise SystemExit(
                      f"release source precondition failed for {relative}: "
                      f"{source_files.get(relative)!r}"
                  )
              payload = (root / relative).read_bytes().replace(b"\r\n", b"\n")
              source_files[relative] = hashlib.sha256(payload).hexdigest()
          release_path.write_text(
              json.dumps(release, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          remaining = []
          for path in (
              verifier,
              bindings,
          ):
              if old_release in path.read_text(encoding="utf-8"):
                  remaining.append(path.as_posix())
          if remaining:
              raise SystemExit(f"stale release id remains in {remaining}")

          Path(
              ".github/workflows/apply-governed-space-release-closure-fix.yml"
          ).unlink()
          PY

      - name: Prove the corrected source closure and contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "ruff==0.16.6" "pytest==9.1.1" \
            "cryptography==49.0.0" "fastapi==0.139.0" \
            "httpx==0.28.1" "pydantic==2.13.4"
          ruff check spaces/szl-model-inference-lab --select E9,F
          python -m py_compile \
            spaces/szl-model-inference-lab/app.py \
            spaces/szl-model-inference-lab/app_governed.py \
            spaces/szl-model-inference-lab/verify_execution_record.py
          PYTHONPATH=spaces/szl-model-inference-lab \
            python -m unittest discover \
              -s spaces/szl-model-inference-lab/tests -v
          PYTHONPATH=tools python tools/test_publish_model_source_bindings.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path("spaces/szl-model-inference-lab")
          sys.path.insert(0, str(root))
          import app
          import verify_execution_record as verifier

          manifest = app.load_release_manifest()
          assert manifest["release_id"] == verifier.EXPECTED_RELEASE_ID
          bindings = json.loads(
              Path("publishing/model-source-bindings.json").read_text(
                  encoding="utf-8"
              )
          )
          runtime = next(
              item["runtime_probe"]
              for item in bindings["artifacts"]
              if item["repo_id"] == "SZLHOLDINGS/SZL-Khipu-1.5B-GGUF"
          )
          assert runtime["release_id"] == manifest["release_id"]
          print("governed Space release closure: PASS")
          PY
          test ! -e \
            .github/workflows/apply-governed-space-release-closure-fix.yml
          git diff --check

      - name: Commit the deterministic release reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Forge Release Operator"
          git config user.email "stephenlutar2@gmail.com"
          git add \
            spaces/szl-model-inference-lab/app_governed.py \
            spaces/szl-model-inference-lab/verify_execution_record.py \
            spaces/szl-model-inference-lab/release.json \
            publishing/model-source-bindings.json \
            .github/workflows/apply-governed-space-release-closure-fix.yml
          git diff --cached --check
          git commit -m "fix(space): reconcile governed release identity" \
            -m "Align the execution verifier and model-source binding with the immutable v2 Space release, remove two proven unused imports, recompute the exact source closure, and delete the one-shot operator." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/live-governed-inference-space-v2
