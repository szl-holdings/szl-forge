name: Apply governed Space release-closure fix

on:
  push:
    branches:
      - feat/live-governed-inference-space-v2
    paths:
      - .github/workflows/apply-governed-space-release-closure-fix.yml

permissions:
  contents: write

concurrency:
  group: governed-space-release-closure-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact governed Space branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/live-governed-inference-space-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile immutable release identity and source closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          space = Path("spaces/szl-model-inference-lab")
          release_path = space / "release.json"
          app_path = space / "app_governed.py"
          verifier_path = space / "verify_execution_record.py"
          binding_path = Path("publishing/model-source-bindings.json")
          workflow_path = Path(
              ".github/workflows/apply-governed-space-release-closure-fix.yml"
          )
          old_release = "c893e93c-9bd8-47e9-941e-f8613a608992"
          release_id = "6165392a-f3b7-4128-8f77-e37074c2e60d"

          def source_sha256(path: Path) -> str:
              return hashlib.sha256(
                  path.read_bytes().replace(b"\r\n", b"\n")
              ).hexdigest()

          release = json.loads(release_path.read_text(encoding="utf-8"))
          if release.get("release_id") != release_id:
              raise SystemExit("release.json immutable release id drift")
          source_files = release.get("source_files")
          if not isinstance(source_files, dict):
              raise SystemExit("release.json source_files is malformed")
          for relative, expected in source_files.items():
              source = space / relative
              actual = source_sha256(source)
              if actual != expected:
                  raise SystemExit(
                      f"pre-edit source closure mismatch for {relative}: "
                      f"{actual} != {expected}"
                  )

          app_text = app_path.read_text(encoding="utf-8")
          app_text = app_text.replace("import hashlib\n", "")
          app_text = app_text.replace(
              "from collections.abc import Mapping, Sequence\n",
              "from collections.abc import Mapping\n",
          )
          if "import hashlib\n" in app_text or "Mapping, Sequence" in app_text:
              raise SystemExit("app_governed unused-import closure failed")
          app_path.write_text(app_text, encoding="utf-8", newline="\n")

          verifier_text = verifier_path.read_text(encoding="utf-8")
          if old_release not in verifier_text and release_id not in verifier_text:
              raise SystemExit("execution verifier release identity missing")
          verifier_text = verifier_text.replace(old_release, release_id)
          if old_release in verifier_text:
              raise SystemExit("stale verifier release identity remains")
          verifier_path.write_text(
              verifier_text, encoding="utf-8", newline="\n"
          )

          binding_text = binding_path.read_text(encoding="utf-8")
          if old_release not in binding_text and release_id not in binding_text:
              raise SystemExit("model-source binding release identity missing")
          binding_text = binding_text.replace(old_release, release_id)
          if old_release in binding_text:
              raise SystemExit("stale binding release identity remains")
          binding_path.write_text(
              binding_text, encoding="utf-8", newline="\n"
          )

          for relative in (
              "app_governed.py",
              "verify_execution_record.py",
          ):
              source_files[relative] = source_sha256(space / relative)
          release_path.write_text(
              json.dumps(release, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          for relative, expected in source_files.items():
              actual = source_sha256(space / relative)
              if actual != expected:
                  raise SystemExit(
                      f"post-edit source closure mismatch for {relative}: "
                      f"{actual} != {expected}"
                  )

          workflow_path.unlink()
          PY

      - name: Prove syntax and clean diff
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            spaces/szl-model-inference-lab/app_governed.py \
            spaces/szl-model-inference-lab/verify_execution_record.py
          python - <<'PY'
          import json
          from pathlib import Path

          release_id = "6165392a-f3b7-4128-8f77-e37074c2e60d"
          release = json.loads(
              Path("spaces/szl-model-inference-lab/release.json").read_text(
                  encoding="utf-8"
              )
          )
          binding = json.loads(
              Path("publishing/model-source-bindings.json").read_text(
                  encoding="utf-8"
              )
          )
          runtime = next(
              artifact["runtime_probe"]
              for artifact in binding["artifacts"]
              if artifact["repo_id"]
              == "SZLHOLDINGS/SZL-Khipu-1.5B-GGUF"
          )
          assert release["release_id"] == release_id
          assert runtime["release_id"] == release_id
          assert not Path(
              ".github/workflows/apply-governed-space-release-closure-fix.yml"
          ).exists()
          print("governed Space release closure: PASS")
          PY
          git diff --check

      - name: Commit repaired production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Forge Release Operator"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit \
            -m "fix(space): close governed release identity and lint" \
            -m "Align the live verifier and model-source binding to the immutable Space release, remove two unused imports, recompute the source closure, and delete the transient repair workflow." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/live-governed-inference-space-v2
