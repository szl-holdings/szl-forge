name: Frontier real evaluation runner

on:
  pull_request:
    paths:
      - ".github/workflows/frontier-evaluation-runner.yml"
      - "frontier/evaluation/**"
      - "tools/acquire_hf_inference_token.py"
      - "tests/test_frontier_evaluation_runner.py"
      - "tests/test_frontier_provider_unavailable_receipt.py"
      - "tests/test_frontier_terminal_evidence.py"
      - "tests/test_acquire_hf_inference_token.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontier-evaluation-runner.yml"
      - "frontier/evaluation/**"
      - "tools/acquire_hf_inference_token.py"
      - "tests/test_frontier_evaluation_runner.py"
      - "tests/test_frontier_provider_unavailable_receipt.py"
      - "tests/test_frontier_terminal_evidence.py"
      - "tests/test_acquire_hf_inference_token.py"
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation fixture set
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full
      publish:
        description: Publish the receipt bundle to the public SZLHOLDINGS evidence dataset
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: read

concurrency:
  group: frontier-real-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: offline contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Run deterministic contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==8.4.2"
          python -m py_compile \
            frontier/evaluation/core.py \
            frontier/evaluation/source.py \
            frontier/evaluation/provider.py \
            frontier/evaluation/failure.py \
            frontier/evaluation/receipt.py \
            frontier/evaluation/runner.py \
            frontier/evaluation/terminal.py \
            tools/acquire_hf_inference_token.py \
            tests/test_frontier_evaluation_runner.py \
            tests/test_frontier_provider_unavailable_receipt.py \
            tests/test_frontier_terminal_evidence.py \
            tests/test_acquire_hf_inference_token.py
          python -m pytest -q \
            tests/test_frontier_evaluation_runner.py \
            tests/test_frontier_provider_unavailable_receipt.py \
            tests/test_frontier_terminal_evidence.py \
            tests/test_acquire_hf_inference_token.py

  real-evaluation:
    name: real candidate vs Khipu
    needs: contract
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      TARGET_DATASET: SZLHOLDINGS/szl-frontier-evaluation-receipts
      TARGET_MODEL: zai-org/GLM-5.3-Flash
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install exact runner dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "huggingface_hub==1.30.0"
          python - <<'PY'
          import huggingface_hub
          assert huggingface_hub.__version__ == "1.30.0"
          print(huggingface_hub.__version__)
          PY

      - name: Select a validated Inference Providers credential
        env:
          HF_INFERENCE_TOKEN_CANDIDATE: ${{ secrets.HF_INFERENCE_TOKEN }}
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python tools/acquire_hf_inference_token.py \
            --target-model "$TARGET_MODEL" \
            --github-env "$GITHUB_ENV" \
            --report reports/hf-inference-credential.json

      - name: Resolve run mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            suite="smoke"
            publish="false"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            suite="${{ inputs.suite }}"
            publish="${{ inputs.publish }}"
          else
            suite="full"
            publish="true"
          fi
          run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_REVISION:0:12}"
          echo "EVAL_SUITE=${suite}" >> "$GITHUB_ENV"
          echo "PUBLISH_RECEIPT=${publish}" >> "$GITHUB_ENV"
          echo "EVAL_RUN_ID=${run_id}" >> "$GITHUB_ENV"

      - name: Select a validated receipt publisher credential
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/acquire_hf_publisher_token.py \
            --target-repo "$TARGET_DATASET" \
            --target-type dataset \
            --allow-create \
            --github-env "$GITHUB_ENV" \
            --report reports/hf-publisher-credential.json

      - name: Execute and verify real bounded evaluation
        shell: bash
        run: |
          set -euo pipefail
          output="reports/frontier-evaluation"
          mkdir -p "$output"
          args=(
            --candidate-id glm-5-3-flash
            --suite "$EVAL_SUITE"
            --output-dir "$output"
            --run-id "$EVAL_RUN_ID"
            --source-repository "$GITHUB_REPOSITORY"
            --source-revision "$SOURCE_REVISION"
            --dataset-id "$TARGET_DATASET"
            --timeout-seconds 180
          )
          if [[ "$PUBLISH_RECEIPT" == "true" ]]; then
            args+=(--publish)
          fi

          set +e
          python frontier/evaluation/runner.py "${args[@]}" \
            | tee "$output/runner-output.jsonl"
          runner_rc="${PIPESTATUS[0]}"
          set -e
          rm -rf "$output/.source-cache"

          # Operational success means the run terminated with complete,
          # content-addressed evidence. It does not mean the model passed.
          python -m frontier.evaluation.terminal \
            --output-dir "$output" \
            --runner-exit-code "$runner_rc" \
            --report "$output/terminal-verification.json"

      - name: Render evaluation summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary_path = Path("reports/frontier-evaluation/summary.json")
          terminal_path = Path(
              "reports/frontier-evaluation/terminal-verification.json"
          )
          print("## SZL frontier real evaluation")
          if not summary_path.exists():
              print("\nNo terminal summary was produced. The workflow remains failed.")
              raise SystemExit(0)
          data = json.loads(summary_path.read_text())
          print(f"\n- Candidate: `{data['model_id']}`")
          print(f"- Provider: `{data['provider']}`")
          print(f"- Suite: `{data['suite']}`")
          print(f"- Candidate score rate: `{data['candidate_metrics']['score_rate']}`")
          print(f"- Khipu score rate: `{data['baseline_metrics']['score_rate']}`")
          print(f"- Model decision: `{data['decision']}`")
          print(f"- Production disposition: `{data['production_disposition']}`")
          print(f"- Receipt: `{data['receipt_sha256']}`")
          if terminal_path.exists():
              terminal = json.loads(terminal_path.read_text())
              print(f"- Terminal evidence verified: `{terminal['ok']}`")
              print(f"- Runner exit code: `{terminal['runner_exit_code']}`")
          PY

      - name: Upload sanitized evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-real-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/frontier-evaluation/
            reports/hf-inference-credential.json
            reports/hf-publisher-credential.json
          if-no-files-found: warn
          retention-days: 30
