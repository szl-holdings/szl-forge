name: Publish SZL kernels source binding

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact protected-main szl-kernels Git revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-szl-kernels
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize protected source without publisher secret
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout trusted Forge gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact kernels source as untrusted test input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-kernels
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted gateway test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.26.0"

      - name: Install pinned first-class Kernel uploader
        run: |
          cargo install --locked \
            --git https://github.com/huggingface/kernels \
            --rev 633246310320d85def0c67d62c7912fd444a842f \
            hf-kernel-builder

      - name: Test trusted gateway contracts
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m unittest -v \
            tools/test_authorize_kernels_release.py \
            tools/test_publish_szl_kernels.py

      - name: Run untrusted source contract without publisher secret
        env:
          PYTHONPATH: source/tools
        run: python -m unittest -v source/tools/test_publish_source_binding.py

      - name: Wait for exact protected-main source gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER_REVISION: ${{ github.sha }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: >-
          python tools/authorize_kernels_release.py
          --source-revision "${SOURCE_REVISION}"
          --publisher-revision "${PUBLISHER_REVISION}"
          --wait-seconds 900
          --report reports/kernels-release-authorization.json

      - name: Upload non-secret authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernels-release-authorization-${{ github.run_id }}
          path: reports/kernels-release-authorization.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish with trusted Forge code and verify readback
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout trusted Forge publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout authorized kernels source as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-kernels
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication client without publisher secret
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.26.0"

      - name: Re-authorize exact source immediately before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER_REVISION: ${{ github.sha }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: >-
          python tools/authorize_kernels_release.py
          --source-revision "${SOURCE_REVISION}"
          --publisher-revision "${PUBLISHER_REVISION}"
          --wait-seconds 0
          --report reports/kernels-release-authorization.json

      - name: Publish declared data with trusted code and verify exact readback
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: >-
          python tools/publish_szl_kernels.py
          --source-dir source
          --source-revision "${SOURCE_REVISION}"
          --authorization-report reports/kernels-release-authorization.json
          --publisher-repository "${GITHUB_REPOSITORY}"
          --publisher-revision "${GITHUB_SHA}"
          --publisher-workflow-ref "${GITHUB_WORKFLOW_REF}"
          --publisher-run-id "${GITHUB_RUN_ID}"
          --publisher-run-attempt "${GITHUB_RUN_ATTEMPT}"
          --publish
          --report reports/source-binding-published.json

      - name: Upload immutable publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-binding-published-${{ github.run_id }}
          path: |
            reports/kernels-release-authorization.json
            reports/source-binding-published.json
          if-no-files-found: error
          retention-days: 90
