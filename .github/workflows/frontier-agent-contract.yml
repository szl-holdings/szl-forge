name: Frontier agent contract
on:
  pull_request:
    paths:
      - tools/szl_frontier_agent.py
      - tests/test_frontier_agent.py
      - examples/frontier_agent/**
      - docs/FRONTIER_AGENT.md
      - .github/workflows/frontier-agent-contract.yml
  push:
    branches: [main]
    paths:
      - tools/szl_frontier_agent.py
      - tests/test_frontier_agent.py
      - examples/frontier_agent/**
      - .github/workflows/frontier-agent-contract.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Execute offline contracts without a model account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git rev-parse HEAD > reports/frontier-agent-source.txt
          python -m unittest discover -s tests -p test_frontier_agent.py -v 2>&1 | tee reports/frontier-agent.log
          python -O -m unittest discover -s tests -p test_frontier_agent.py -v 2>&1 | tee reports/frontier-agent-optimized.log
          python -I -B tools/szl_frontier_agent.py --help
          python -I -B examples/frontier_agent/prepare_powershell_repair.py --help
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frontier-agent-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.python }}
          path: reports/frontier-agent*
          if-no-files-found: error
          retention-days: 90
