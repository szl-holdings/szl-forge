name: AirLLM qualification lab

on:
  pull_request:
    paths:
      - 'frontier/airllm-qualification-lab/**'
      - '.github/workflows/airllm-qualification-lab.yml'
  push:
    branches: [main]
    paths:
      - 'frontier/airllm-qualification-lab/**'
      - '.github/workflows/airllm-qualification-lab.yml'

permissions:
  contents: read

jobs:
  software-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run MODELED and SIMULATED software controls
        working-directory: frontier/airllm-qualification-lab
        run: python -I -B -m unittest discover -s . -p 'test_*.py' -v
