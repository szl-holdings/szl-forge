name: Apply HF Space create-or-recover fix

on:
  push:
    branches:
      - fix/hf-space-create-recover-v1
    paths:
      - .github/workflows/apply-hf-space-create-recover.yml

permissions:
  contents: write

concurrency:
  group: apply-hf-space-create-recover-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-space-create-recover-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Add race-safe repository reconciliation and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          publisher_path = Path("tools/publish_hf_space.py")
          tests_path = Path("tools/test_publish_hf_space.py")
          workflow_path = Path(
              ".github/workflows/apply-hf-space-create-recover.yml"
          )

          publisher = publisher_path.read_text(encoding="utf-8")
          function_anchor = "\n\ndef clear_legacy_space_volumes(\n"
          function = '''

          def ensure_space_repository(
              api: Any,
              repo_id: str,
              *,
              static: bool = False,
          ) -> dict[str, Any]:
              """Create a missing Space or prove write access to the existing one.

              Credential validation happens before this function. A missing target is
              created once with the declared SDK; ``exist_ok`` makes concurrent recovery
              race-safe. The post-create readback and write check remain mandatory.
              """

              from huggingface_hub.utils import RepositoryNotFoundError

              sdk = "static" if static else "docker"
              created = False
              try:
                  info = api.space_info(repo_id, files_metadata=False)
              except RepositoryNotFoundError:
                  api.create_repo(
                      repo_id=repo_id,
                      repo_type="space",
                      space_sdk=sdk,
                      private=False,
                      exist_ok=True,
                  )
                  created = True
                  info = api.space_info(repo_id, files_metadata=False)

              observed_id = str(
                  getattr(info, "id", None)
                  or getattr(info, "repo_id", None)
                  or repo_id
              )
              if observed_id.casefold() != repo_id.casefold():
                  raise PublishError(
                      f"Space identity mismatch: {observed_id!r} != {repo_id!r}"
                  )
              api.auth_check(repo_id=repo_id, repo_type="space", write=True)
              return {
                  "state": (
                      "CREATED_AND_WRITE_CONFIRMED"
                      if created
                      else "EXISTING_AND_WRITE_CONFIRMED"
                  ),
                  "repo_id": repo_id,
                  "sdk": sdk,
                  "created": created,
                  "visibility_on_create": "public" if created else None,
                  "write_access": "CONFIRMED",
              }
          '''
          if "def ensure_space_repository(" not in publisher:
              if function_anchor not in publisher:
                  raise SystemExit("publisher function insertion anchor not found")
              publisher = publisher.replace(
                  function_anchor,
                  function + function_anchor,
                  1,
              )

          call_anchor = '''    api = HfApi(token=token)
              repo_id = plan["repo_id"]
              if clear_space_volumes:
          '''
          call_replacement = '''    api = HfApi(token=token)
              repo_id = plan["repo_id"]
              plan["repository_reconciliation"] = ensure_space_repository(
                  api,
                  repo_id,
                  static=static,
              )
              if clear_space_volumes:
          '''
          if 'plan["repository_reconciliation"]' not in publisher:
              if call_anchor not in publisher:
                  raise SystemExit("publisher reconciliation call anchor not found")
              publisher = publisher.replace(call_anchor, call_replacement, 1)
          publisher_path.write_text(publisher, encoding="utf-8", newline="\n")

          tests = tests_path.read_text(encoding="utf-8")
          import_anchor = "import subprocess\nimport unittest\n"
          import_replacement = (
              "import subprocess\nimport unittest\n\n"
              "import httpx\n"
              "from huggingface_hub.utils import RepositoryNotFoundError\n"
          )
          if "from huggingface_hub.utils import RepositoryNotFoundError" not in tests:
              if import_anchor not in tests:
                  raise SystemExit("test import anchor not found")
              tests = tests.replace(import_anchor, import_replacement, 1)

          test_anchor = (
              "    def test_legacy_volume_removal_is_observed(self) -> None:\n"
          )
          test_block = '''    @staticmethod
              def _missing_space() -> RepositoryNotFoundError:
                  request = httpx.Request(
                      "GET", "https://huggingface.co/api/spaces/owner/space"
                  )
                  return RepositoryNotFoundError(
                      "missing Space",
                      response=httpx.Response(404, request=request),
                  )

              def test_existing_space_is_write_confirmed_without_recreation(self) -> None:
                  api = Mock()
                  api.space_info.return_value = SimpleNamespace(
                      id="owner/space",
                      runtime=SimpleNamespace(volumes=[]),
                  )

                  result = publisher.ensure_space_repository(api, "owner/space")

                  self.assertEqual(
                      "EXISTING_AND_WRITE_CONFIRMED", result["state"]
                  )
                  self.assertFalse(result["created"])
                  self.assertEqual("docker", result["sdk"])
                  api.create_repo.assert_not_called()
                  api.auth_check.assert_called_once_with(
                      repo_id="owner/space",
                      repo_type="space",
                      write=True,
                  )

              def test_missing_docker_space_is_created_and_read_back(self) -> None:
                  api = Mock()
                  api.space_info.side_effect = [
                      self._missing_space(),
                      SimpleNamespace(
                          id="owner/space",
                          runtime=SimpleNamespace(volumes=[]),
                      ),
                  ]

                  result = publisher.ensure_space_repository(api, "owner/space")

                  self.assertEqual(
                      "CREATED_AND_WRITE_CONFIRMED", result["state"]
                  )
                  self.assertTrue(result["created"])
                  self.assertEqual("public", result["visibility_on_create"])
                  api.create_repo.assert_called_once_with(
                      repo_id="owner/space",
                      repo_type="space",
                      space_sdk="docker",
                      private=False,
                      exist_ok=True,
                  )
                  api.auth_check.assert_called_once_with(
                      repo_id="owner/space",
                      repo_type="space",
                      write=True,
                  )

              def test_missing_static_space_uses_static_sdk(self) -> None:
                  api = Mock()
                  api.space_info.side_effect = [
                      self._missing_space(),
                      SimpleNamespace(
                          id="owner/space",
                          runtime=SimpleNamespace(volumes=[]),
                      ),
                  ]

                  result = publisher.ensure_space_repository(
                      api,
                      "owner/space",
                      static=True,
                  )

                  self.assertEqual("static", result["sdk"])
                  api.create_repo.assert_called_once_with(
                      repo_id="owner/space",
                      repo_type="space",
                      space_sdk="static",
                      private=False,
                      exist_ok=True,
                  )

          '''
          if "test_missing_docker_space_is_created_and_read_back" not in tests:
              if test_anchor not in tests:
                  raise SystemExit("test insertion anchor not found")
              tests = tests.replace(test_anchor, test_block + test_anchor, 1)
          tests_path.write_text(tests, encoding="utf-8", newline="\n")

          workflow_path.unlink()
          PY

      - name: Install exact Hub client and verify repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "huggingface-hub==1.23.0"
          python -m py_compile tools/publish_hf_space.py tools/test_publish_hf_space.py
          PYTHONPATH=tools python tools/test_publish_hf_space.py
          git diff --check
          test ! -e .github/workflows/apply-hf-space-create-recover.yml

      - name: Commit canonical publisher repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Forge Release Operator"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit \
            -m "fix(hf): create or recover missing inference Space" \
            -m "Make exact-source publication race-safe for an absent Space by creating the declared Docker or static repository, reading its identity back, and proving target write access before any volume or file mutation. Add deterministic existing, missing, and SDK-selection tests." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/hf-space-create-recover-v1
