# SPDX-License-Identifier: Apache-2.0
name: ReceiptAgent curriculum byte integrity

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitattributes"
      - "receiptagent/**"
      - "tests/test_receiptagent_curriculum_bytes.py"
      - ".github/workflows/receiptagent-curriculum-byte-integrity.yml"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "receiptagent/**"
      - "tests/test_receiptagent_curriculum_bytes.py"
      - ".github/workflows/receiptagent-curriculum-byte-integrity.yml"

permissions:
  contents: read

concurrency:
  group: receiptagent-curriculum-bytes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ReceiptAgent raw-byte integrity (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.12"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Exercise the Windows newline default on both platforms
        shell: bash
        run: git config --global core.autocrlf true

      - name: Check out exact candidate without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Verify raw bytes without models, training, or publication
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git config --get core.autocrlf)" = true
          git rev-parse HEAD
          git config --get core.autocrlf
          git check-attr text eol -- receiptagent/train.jsonl receiptagent/eval.jsonl receiptagent/train.refusals.jsonl receiptagent/adversarial.jsonl receiptagent/receiptagent.schema.json
          python -I -S -B -m unittest discover -s tests -p test_receiptagent_curriculum_bytes.py -v
          python -I -S -B -O -m unittest discover -s tests -p test_receiptagent_curriculum_bytes.py -v
          git diff --exit-code
          git diff --check
