name: Approved Document Evidence Contracts

on:
  pull_request:
    paths:
      - "operational/approved_documents/**"
      - ".github/workflows/approved-documents.yml"
  push:
    branches: [main]
    paths:
      - "operational/approved_documents/**"
      - ".github/workflows/approved-documents.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-documents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Document evidence (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline contract tests
        run: python -I -B operational/approved_documents/test_adapter.py -v
