name: SZL Access installed application

on:
  pull_request:
    paths:
      - 'access-lab/**'
      - '.gitattributes'
      - '.github/workflows/szl-access-lab.yml'
  push:
    branches: [main]
    paths:
      - 'access-lab/**'
      - '.gitattributes'
      - '.github/workflows/szl-access-lab.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: szl-access-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-application:
    name: Access installed ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build, install, and verify outside the checkout
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile, venv
          root = pathlib.Path.cwd().resolve()
          output = root / 'artifacts' / 'szl-access-installed'
          output.mkdir(parents=True, exist_ok=False)
          def run(exe, args, cwd, **kwargs):
              return subprocess.run([str(exe), '-I', '-B', *args], cwd=cwd,
                  check=True, timeout=180, **kwargs)
          with tempfile.TemporaryDirectory(prefix='szl-access-ci-', dir=os.environ['RUNNER_TEMP']) as temp:
              temporary = pathlib.Path(temp)
              environment = temporary / 'venv'
              venv.EnvBuilder(with_pip=True).create(environment)
              exe = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              run(exe, ['-m', 'pip', 'install', 'pytest==8.4.2', 'build==1.5.0', 'setuptools==83.0.0'], temporary)
              run(exe, ['-m', 'build', '--wheel', '--no-isolation', '--outdir', str(output), str(root / 'access-lab')], temporary)
              wheels = list(output.glob('szl_access_lab-*.whl'))
              if len(wheels) != 1:
                  raise RuntimeError('Expected exactly one freshly built Access wheel')
              run(exe, ['-m', 'pip', 'install', '--no-deps', str(wheels[0])], temporary)
              run(exe, ['-m', 'pip', 'check'], temporary)
              run(exe, ['-m', 'pytest', str(root / 'access-lab' / 'tests'), '-q', '--import-mode=importlib'], temporary)
              result = run(exe, ['-m', 'szl_access.benchmark'], temporary, capture_output=True, text=True)
              report = json.loads(result.stdout)
              if report['status'] != 'PASS':
                  raise RuntimeError('Benchmark did not pass')
              (output / 'synthetic-benchmark.json').write_text(result.stdout, encoding='utf-8')
              run(exe, [str(root / 'access-lab' / 'tools' / 'verify_installed.py'),
                  '--wheel', str(wheels[0]), '--source-sha', os.environ['GITHUB_SHA'],
                  '--output', str(output / 'installed-application.json')], temporary)
      - name: Retain wheel and synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szl-access-${{ matrix.os }}-python-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/szl-access-installed/*.whl
            artifacts/szl-access-installed/*.json
          if-no-files-found: warn
          retention-days: 14
