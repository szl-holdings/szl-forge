name: MiniCPM5 qualification contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify bounded evaluator without ML dependencies or network
        run: |
          python -m py_compile inference/minicpm5_qualification.py inference/verify_minicpm5_report.py
          python -m unittest discover -s tests -p 'test_minicpm5*.py' -v
      - name: Emit plan, not fabricated measurements
        run: python inference/minicpm5_qualification.py --output artifacts/minicpm5-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minicpm5-plan-${{ github.run_id }}
          path: artifacts/minicpm5-plan.json
          if-no-files-found: error
          retention-days: 30
