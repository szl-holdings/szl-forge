name: Production governed inference v2

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact runtime and test toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "pytest>=8,<9" \
            "build>=1.2,<2" \
            "szl-nemo @ git+https://github.com/szl-holdings/szl-nemo.git@810231a531188bb569e3faa17396386eb0a5e260" \
            "szl-second-brain @ git+https://github.com/szl-holdings/szl-second-brain.git@fa3e4605344b13db220a79f9dcd267ee5725c87e"
          python -m pip install --disable-pip-version-check -e .

      - name: Validate pinned authority contract
        run: |
          python - <<'PY'
          import importlib.metadata
          from inference import __version__, load_production_contract

          contract = load_production_contract()
          assert __version__ == importlib.metadata.version("szl-forge-inference") == "0.2.0"
          assert importlib.metadata.version("szl-nemo") == "0.4.0"
          assert importlib.metadata.version("szl-second-brain") == "1.2.0"
          assert contract["sources"]["nemo_witness"]["commit"] == "810231a531188bb569e3faa17396386eb0a5e260"
          assert contract["sources"]["second_brain"]["commit"] == "fa3e4605344b13db220a79f9dcd267ee5725c87e"
          assert contract["formula_authority"]["locked_proven_count"] == 8
          assert contract["runtime_selection"]["winner"] == "UNSELECTED"
          PY

      - name: Run production boundary and real runtime integration suites
        run: >-
          python -m pytest -q
          tests/test_production_inference_v2.py
          tests/test_production_runtime_integration.py

      - name: Build controller wheel
        run: python -m build --wheel

      - name: Prove isolated installed-mode controller
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/szl-forge-inference-installed"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check \
            "szl-nemo @ git+https://github.com/szl-holdings/szl-nemo.git@810231a531188bb569e3faa17396386eb0a5e260" \
            "szl-second-brain @ git+https://github.com/szl-holdings/szl-second-brain.git@fa3e4605344b13db220a79f9dcd267ee5725c87e"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$venv/bin/python" - <<'PY'
          import importlib.metadata
          from inference import (
              load_production_contract,
              make_second_brain_hydrator,
              make_second_brain_retriever,
              make_szl_nemo_envelope_witness,
          )
          from second_brain import index

          assert importlib.metadata.version("szl-forge-inference") == "0.2.0"
          assert index().built is True
          assert index().n == 575
          assert callable(make_second_brain_retriever())
          assert callable(make_second_brain_hydrator(lambda *_args: True))
          assert callable(make_szl_nemo_envelope_witness())
          assert load_production_contract()["status"] == "OPERATIONAL_GOVERNED_BOUNDARY"
          PY
          )
