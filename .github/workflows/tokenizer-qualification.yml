name: Tokenizer observer contract
on:
  pull_request:
    paths:
      - 'eval/tokenizer*'
      - 'eval/TOKENIZER_QUALIFICATION.md'
      - 'tests/test_tokenizer_*.py'
      - 'tests/run_tokenizer_native_smoke.py'
      - '.github/workflows/tokenizer-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'eval/tokenizer*'
      - 'eval/TOKENIZER_QUALIFICATION.md'
      - 'tests/test_tokenizer_*.py'
      - 'tests/run_tokenizer_native_smoke.py'
      - '.github/workflows/tokenizer-qualification.yml'
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline contract controls, normal and optimized
        run: |
          python -m unittest discover -s tests -p "test_tokenizer_*.py" -v
          python -O -m unittest discover -s tests -p "test_tokenizer_*.py" -v
      - name: Install only hash-bound synthetic-control wheel
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r eval/tokenizer-smoke-requirements.txt
      - name: Real native same-build controls; no v1, Hub, models or training
        env:
          OBSERVED_SOURCE: ${{ github.sha }}
        shell: bash
        run: python tests/run_tokenizer_native_smoke.py --source "$OBSERVED_SOURCE" --output artifacts/tokenizer-native-control
      - name: Preserve synthetic control evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenizer-native-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tokenizer-native-control/
          if-no-files-found: warn
          retention-days: 14
