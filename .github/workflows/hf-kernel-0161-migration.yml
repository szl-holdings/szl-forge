name: HF Kernel 0.16.1 migration

on:
  pull_request:
    paths:
      - "tools/hf_kernel_migration_guard.py"
      - "tools/test_hf_kernel_migration_guard.py"
      - "tools/hf_kernel_hub_ops.py"
      - "tools/test_hf_kernel_hub_ops.py"
      - "docs/KERNEL_HUB_STATUS.md"
      - "tools/observe_kernel_fleet.py"
      - "tools/test_observe_kernel_fleet.py"
      - "docs/KERNEL_FLEET_OBSERVATION.md"
      - ".github/workflows/hf-kernel-0161-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-kernel-0161-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Org policy: every action is pinned to a full-length commit SHA.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run offline fleet consumer and evidence regressions
        run: python -m unittest -v tools.test_hf_kernel_hub_ops

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check "huggingface-hub==1.26.0"

      - name: Run migration guard unit tests
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools.test_hf_kernel_migration_guard

      - name: Verify public first-class Kernel Hub projection
        env:
          PYTHONPATH: tools
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
        run: |
          python - <<'PY'
          from dataclasses import asdict
          import json
          from hf_kernel_migration_guard import verify_first_class_kernel

          evidence = verify_first_class_kernel(
              "SZLHOLDINGS/szl-kernels",
              client_version="0.16.1",
          )
          print(json.dumps(asdict(evidence), indent=2, sort_keys=True))
          PY

      - name: Enforce migration invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'KERNELS_CLIENT_VERSION = "0.16.1"' tools/hf_kernel_migration_guard.py
          grep -F 'FIRST_CLASS_REPO_TYPE = "kernel"' tools/hf_kernel_migration_guard.py
          grep -F 'LEGACY_REPO_TYPE = "model"' tools/hf_kernel_migration_guard.py
          git diff --check

  fleet-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Offline collector regressions
        run: python -m unittest -v tools.test_observe_kernel_fleet
      - name: Observe public first-class kernel items and immutable metadata
        run: |
          python tools/observe_kernel_fleet.py \
            --source-revision "$(git rev-parse HEAD)" \
            --output kernel-fleet-observation.json
      - name: Retain observation including unavailable or partial results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-fleet-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: kernel-fleet-observation.json
          if-no-files-found: error
          retention-days: 30
