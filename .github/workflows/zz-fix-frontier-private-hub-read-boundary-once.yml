# SPDX-License-Identifier: Apache-2.0
name: Fix frontier private-Hub read boundary once

on:
  push:
    branches:
      - fix/frontier-private-hub-read-boundary-20260905
    paths:
      - .github/workflows/zz-fix-frontier-private-hub-read-boundary-once.yml

permissions:
  contents: write

concurrency:
  group: fix-frontier-private-hub-read-boundary-once
  cancel-in-progress: false

jobs:
  repair:
    name: separate credentialless PR proof from trusted-main gated readback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/frontier-private-hub-read-boundary-20260905
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Patch the permanent workflow exactly
        run: python tools/patch_frontier_private_hub_workflow_once.py

      - name: Prove the lifecycle separation contract
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/patch_frontier_private_hub_workflow_once.py \
            tools/test_model_kernel_frontier_workflow.py
          python tools/test_model_kernel_frontier_workflow.py
          git diff --check

      - name: Commit the permanent repair and retire bounded controls
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/zz-fix-frontier-private-hub-read-boundary-once.yml \
            tools/patch_frontier_private_hub_workflow_once.py
          git add \
            .github/workflows/model-kernel-frontier.yml \
            tools/test_model_kernel_frontier_workflow.py
          git config user.name "SZL Frontier Evidence Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit \
            -m "fix(ci): isolate gated Hub readback from PR verification" \
            -m "Keep pull requests credentialless and prove source-binding behavior through offline contracts. Run exact private-Hub receipt readback only on a trusted main push after actively validating an organization credential, and retain sanitized evidence." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/frontier-private-hub-read-boundary-20260905
