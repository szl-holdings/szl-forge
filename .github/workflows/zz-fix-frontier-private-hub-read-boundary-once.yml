# SPDX-License-Identifier: Apache-2.0
name: Export frontier private-Hub workflow repair once

on:
  push:
    branches:
      - fix/frontier-private-hub-read-boundary-20260905
    paths:
      - .github/workflows/zz-fix-frontier-private-hub-read-boundary-once.yml

permissions:
  contents: write

concurrency:
  group: export-frontier-private-hub-workflow-repair-once
  cancel-in-progress: false

jobs:
  export:
    name: prove and export the permanent workflow bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/frontier-private-hub-read-boundary-20260905
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Transform and prove the workflow
        run: |
          set -euo pipefail
          python tools/patch_frontier_private_hub_workflow_once.py
          python -m py_compile \
            tools/patch_frontier_private_hub_workflow_once.py \
            tools/test_model_kernel_frontier_workflow.py
          python tools/test_model_kernel_frontier_workflow.py
          git diff --check

      - name: Export exact verified bytes without workflow-token mutation
        run: |
          set -euo pipefail
          mkdir -p reports
          cp .github/workflows/model-kernel-frontier.yml \
            reports/model-kernel-frontier.patched.yml
          git restore .github/workflows/model-kernel-frontier.yml
          git add reports/model-kernel-frontier.patched.yml
          git config user.name "SZL Frontier Evidence Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit \
            -m "chore(ci): export verified frontier workflow repair" \
            -m "The generated file is an exact connector handoff and will be deleted after the workflow file is committed through an identity with workflow permission." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/frontier-private-hub-read-boundary-20260905
