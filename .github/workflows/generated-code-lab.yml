name: Generated code lab offline contracts
on:
  pull_request:
    paths:
      - 'local-compute/generated-code-lab/**'
      - '.github/workflows/generated-code-lab.yml'
  push:
    branches: [main]
    paths:
      - 'local-compute/generated-code-lab/**'
      - '.github/workflows/generated-code-lab.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline source contracts only (no models, Docker or providers)
        run: python -B -m unittest discover -s local-compute/generated-code-lab -p 'test_*.py' -v
