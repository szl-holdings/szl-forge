name: Yachay development evaluation source

on:
  pull_request:
    paths:
      - frontier/yachay-development-eval/**
      - .github/workflows/yachay-development-eval.yml
  push:
    branches: [main]
    paths:
      - frontier/yachay-development-eval/**
      - .github/workflows/yachay-development-eval.yml

permissions:
  contents: read

jobs:
  source-tests:
    name: CPU source tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: CPU unit tests; no model downloads or GPU work
        run: python -I -B -m unittest discover -s frontier/yachay-development-eval -p 'test_*.py' -v
