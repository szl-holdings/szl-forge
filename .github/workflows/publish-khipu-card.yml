# SPDX-License-Identifier: Apache-2.0
name: Publish Khipu family model cards

on:
  pull_request:
    branches: [main]
    paths:
      - "khipu/card/**"
      - "khipu-r2/card/**"
      - "tools/publish_khipu_card.py"
      - "tests/test_publish_khipu_card.py"
      - "tools/acquire_hf_publisher_token.py"
      - "tests/test_acquire_hf_publisher_token.py"
      - "tests/test_hf_org_token1_fallback.py"
      - ".github/workflows/publish-khipu-card.yml"
  push:
    branches: [main]
    paths:
      - "khipu/card/**"
      - "khipu-r2/card/**"
      - "tools/publish_khipu_card.py"
      - "tests/test_publish_khipu_card.py"
      - "tools/acquire_hf_publisher_token.py"
      - "tests/test_acquire_hf_publisher_token.py"
      - "tests/test_hf_org_token1_fallback.py"
      - ".github/workflows/publish-khipu-card.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-khipu-family-cards
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' }}
    name: Verify closed-profile card and source-binding contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact verification clients
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface-hub==1.23.0" "pytest==9.1.1"

      - name: Prove publisher and credential contracts offline
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"
          python -m pytest -q \
            tests/test_publish_khipu_card.py \
            tests/test_acquire_hf_publisher_token.py \
            tests/test_hf_org_token1_fallback.py
          python -m py_compile \
            tools/publish_khipu_card.py \
            tools/acquire_hf_publisher_token.py
          python tools/publish_khipu_card.py \
            --profile khipu \
            --source-revision "${SOURCE_REVISION}" \
            --report reports/khipu-card-dry-run.json
          python tools/publish_khipu_card.py \
            --profile khipu-r2 \
            --source-revision "${SOURCE_REVISION}" \
            --report reports/khipu-r2-card-dry-run.json
          git diff --check

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: khipu-family-card-dry-run-${{ github.run_id }}
          path: |
            reports/khipu-card-dry-run.json
            reports/khipu-r2-card-dry-run.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Publish ${{ matrix.profile }} and verify exact Hub bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: khipu
            repo_id: SZLHOLDINGS/SZL-Khipu-1.5B
            receipt: khipu-card
          - profile: khipu-r2
            repo_id: SZLHOLDINGS/KHIPU-R2
            receipt: khipu-r2-card
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact protected-main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication clients
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface-hub==1.23.0" "pytest==9.1.1"

      - name: Prove local publisher contracts
        run: >-
          python -m pytest -q
          tests/test_publish_khipu_card.py
          tests/test_acquire_hf_publisher_token.py
          tests/test_hf_org_token1_fallback.py

      - name: Bind matrix target to the closed profile registry
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET_REPO: ${{ matrix.repo_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from tools.publish_khipu_card import resolve_profile

          profile = resolve_profile(os.environ["PROFILE"])
          if profile.repo_id != os.environ["TARGET_REPO"]:
              raise SystemExit("workflow target drifted from the closed profile registry")
          PY

      - name: Acquire and actively validate model publisher credential
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/acquire_hf_publisher_token.py \
            --target-repo "${{ matrix.repo_id }}" \
            --target-type model \
            --github-env "${GITHUB_ENV}" \
            --report "reports/${{ matrix.receipt }}-credential.json"

      - name: Publish card, banner, and deterministic source binding
        run: |
          set -euo pipefail
          python tools/publish_khipu_card.py \
            --profile "${{ matrix.profile }}" \
            --source-revision "${GITHUB_SHA}" \
            --publish \
            --report "reports/${{ matrix.receipt }}-publication.json"

      - name: Upload secret-free publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.receipt }}-publication-${{ github.run_id }}
          path: |
            reports/${{ matrix.receipt }}-credential.json
            reports/${{ matrix.receipt }}-publication.json
          if-no-files-found: error
          retention-days: 90
