name: Model candidate source contracts
on:
  pull_request:
    paths:
      - 'model_candidates/**'
      - 'candidate-tests/**'
      - 'pyproject.toml'
      - '.github/workflows/model-candidates.yml'
  push:
    branches: [main]
    paths:
      - 'model_candidates/**'
      - 'candidate-tests/**'
      - 'pyproject.toml'
      - '.github/workflows/model-candidates.yml'
permissions:
  contents: read
jobs:
  cpu-contracts:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r candidate-tests/requirements.txt
      - name: Synthetic architecture and local HTTP contracts, not model qualification
        run: python -m pytest -q candidate-tests
