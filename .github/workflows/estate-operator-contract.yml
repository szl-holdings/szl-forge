name: Native estate operator contract
on:
  pull_request:
    paths:
      - tools/szl_estate_operator.py
      - tools/ESTATE_OPERATOR.md
      - tests/test_szl_estate_operator.py
      - .github/workflows/estate-operator-contract.yml
  push:
    branches: [main]
    paths:
      - tools/szl_estate_operator.py
      - tools/ESTATE_OPERATOR.md
      - tests/test_szl_estate_operator.py
      - .github/workflows/estate-operator-contract.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Execute offline tests without provider authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git rev-parse HEAD > reports/estate-operator-source.txt
          python -m unittest discover -s tests -p test_szl_estate_operator.py -v 2>&1 | tee reports/estate-operator.log
          python -O -m unittest discover -s tests -p test_szl_estate_operator.py -v 2>&1 | tee reports/estate-operator-optimized.log
          python -I -B tools/szl_estate_operator.py --help
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: estate-operator-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.python }}
          path: reports/estate-operator*
          if-no-files-found: error
          retention-days: 90
