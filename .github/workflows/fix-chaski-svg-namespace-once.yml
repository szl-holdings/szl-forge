name: Repair Chaski SVG namespace validation once

on:
  push:
    branches:
      - feat/source-bound-chaski-card-publisher-20260905
    paths:
      - .github/workflows/fix-chaski-svg-namespace-once.yml

permissions:
  contents: write

concurrency:
  group: fix-chaski-svg-namespace-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact publisher branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/source-bound-chaski-card-publisher-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Permit only the canonical SVG namespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("tools/publish_chaski_card.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    lowered = banner.lower()
              for forbidden in ("<script", "javascript:", "http://", "https://"):
                  if forbidden in lowered:
                      raise PublicationError(f"unsafe or remote SVG content present: {forbidden}")
          '''
          new = '''    lowered = banner.lower()
              namespace = 'xmlns="http://www.w3.org/2000/svg"'
              if lowered.count(namespace) != 1:
                  raise PublicationError("canonical SVG namespace must appear exactly once")
              remote_scan = lowered.replace(namespace, "", 1)
              for forbidden in ("<script", "javascript:", "http://", "https://"):
                  if forbidden in remote_scan:
                      raise PublicationError(f"unsafe or remote SVG content present: {forbidden}")
          '''
          if source.count(old) != 1:
              raise SystemExit("SVG validator anchor drifted")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          test_path = Path("tests/test_publish_chaski_card.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = '''    assert '<script' not in svg
              assert "javascript:" not in svg
              assert "http://" not in svg
              assert "https://" not in svg
              assert len(assets["holo-banner.svg"]) < 10_000
          '''
          new_test = '''    assert '<script' not in svg
              assert "javascript:" not in svg
              namespace = 'xmlns="http://www.w3.org/2000/svg"'
              assert svg.count(namespace) == 1
              remote_scan = svg.replace(namespace, "", 1)
              assert "http://" not in remote_scan
              assert "https://" not in remote_scan
              assert len(assets["holo-banner.svg"]) < 10_000


          def test_svg_remote_reference_is_rejected() -> None:
              assets = publisher.load_assets()
              assets["holo-banner.svg"] = assets["holo-banner.svg"].replace(
                  b"<svg ",
                  b'<svg data-remote="https://evil.invalid" ',
                  1,
              )
              with pytest.raises(publisher.PublicationError, match="remote SVG content"):
                  publisher.validate_assets(assets)
          '''
          if tests.count(old_test) != 1:
              raise SystemExit("SVG test anchor drifted")
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding="utf-8", newline="\n")
          PY

      - name: Prove local namespace and remote-reference rejection
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "huggingface-hub==1.23.0" "pytest==9.1.1"
          python -m py_compile tools/publish_chaski_card.py tests/test_publish_chaski_card.py
          python -m pytest -q \
            tests/test_publish_chaski_card.py \
            tests/test_acquire_hf_publisher_token.py \
            tests/test_hf_org_token1_fallback.py
          python tools/publish_chaski_card.py \
            --source-revision "${GITHUB_SHA}" \
            --report reports/chaski-card-dry-run.json
          git diff --check

      - name: Remove transport and push the clean repair
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fix-chaski-svg-namespace-once.yml
          git add tools/publish_chaski_card.py tests/test_publish_chaski_card.py
          git diff --cached --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git commit -s \
            -m "fix(publish): permit only the canonical SVG namespace" \
            -m "Allow the mandatory W3C SVG namespace while continuing to reject scripts, javascript URLs, and every other HTTP or HTTPS reference."
          git push origin HEAD:feat/source-bound-chaski-card-publisher-20260905
