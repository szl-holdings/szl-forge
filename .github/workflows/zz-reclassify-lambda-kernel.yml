name: Reclassify Lambda Gate as software kernel

on:
  push:
    branches:
      - feat/chaski-r2-bf16-lora

permissions:
  contents: write

concurrency:
  group: reclassify-lambda-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Correct the canonical Hub artifact class
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          paths = [
              Path("portfolio/model_portfolio.json"),
              Path("spaces/szl-forge-lab/model_portfolio.json"),
          ]
          documents = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          if documents[0] != documents[1]:
              raise SystemExit("canonical and Space portfolio copies already diverge")

          changed = 0
          for document in documents:
              matches = [
                  item
                  for item in document.get("artifacts", [])
                  if item.get("repo_id") == "SZLHOLDINGS/szl-lambda-gate"
              ]
              if len(matches) != 1:
                  raise SystemExit("expected exactly one szl-lambda-gate portfolio entry")
              item = matches[0]
              expected = {
                  "repo_id": "SZLHOLDINGS/szl-lambda-gate",
                  "kind": "learned_kernel",
                  "role": "bounded_formula_gate_tensor",
                  "github_source": "https://github.com/szl-holdings/szl-lambda-gate",
                  "required_files": ["model.safetensors"],
                  "max_total_weight_bytes": 1048576,
                  "autonomy_eligible": False,
                  "maturity": "MEASURED_KERNEL",
              }
              if item != expected:
                  raise SystemExit(f"unexpected prior Lambda Gate contract: {item!r}")
              item.clear()
              item.update(
                  {
                      "repo_id": "SZLHOLDINGS/szl-lambda-gate",
                      "kind": "software_kernel",
                      "role": "bounded_formula_gate_tensor",
                      "github_source": "https://github.com/szl-holdings/szl-lambda-gate",
                      "autonomy_eligible": False,
                      "maturity": "MEASURED_KERNEL",
                  }
              )
              changed += 1

          for path, document in zip(paths, documents, strict=True):
              path.write_text(
                  json.dumps(document, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          if changed != 2:
              raise SystemExit("both canonical portfolio copies were not corrected")
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit("corrected portfolio copies are not byte-identical")
          PY

          python3 -m json.tool portfolio/model_portfolio.json >/dev/null
          python3 -m json.tool spaces/szl-forge-lab/model_portfolio.json >/dev/null
          git diff --check

      - name: Commit the exact truth correction and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-reclassify-lambda-kernel.yml
          git add portfolio/model_portfolio.json spaces/szl-forge-lab/model_portfolio.json
          git diff --cached --check
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit \
            -m 'fix(portfolio): classify Lambda Gate as software kernel' \
            -m 'Align the canonical and Forge Lab portfolio copies with the actual source repository and public Hub bytes: Lambda Gate is a Python/Torch software kernel and carries no learned weight artifact. Remove the impossible model.safetensors requirement without weakening trained-model checks.' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
          git push origin "HEAD:${GITHUB_REF_NAME}"
