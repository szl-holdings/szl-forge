name: Publish model inference lab

on:
  push:
    branches: [main]
    paths:
      - "spaces/szl-model-inference-lab/**"
      - "publishing/model-source-bindings.json"
      - "tools/publish_model_source_bindings.py"
      - "tools/test_publish_model_source_bindings.py"
      - "tools/run_governed_live_verifier.py"
      - "tests/test_governed_live_verifier_entrypoint.py"
      - ".github/workflows/publish-model-inference-lab.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-model-inference-lab-and-source-bindings
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish exact source and attest running revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication clients
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0"
          "requests==2.32.5"
          "pytest==9.1.1"

      - name: Verify definition-complete live verifier entrypoint
        run: >-
          python -m pytest -q
          tests/test_governed_live_verifier_entrypoint.py

      - name: Acquire Hugging Face publisher credential
        env:
          HF_OIDC_RESOURCE: spaces/SZLHOLDINGS/szl-model-inference-lab
          HF_FALLBACK_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_ORG_TOKEN }}
        run: |
          set -euo pipefail
          token=""
          if token="$(hf auth token 2>oidc-error.log)" && [[ -n "${token}" ]]; then
            echo "Using short-lived Hugging Face Trusted Publisher credential."
          elif [[ -n "${HF_FALLBACK_TOKEN:-}" ]]; then
            echo "::warning::Trusted Publisher exchange unavailable; using the configured fallback credential."
            token="${HF_FALLBACK_TOKEN}"
          else
            cat oidc-error.log >&2 || true
            echo "::error::No Hugging Face publisher credential is available."
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "HF_TOKEN=${token}" >> "${GITHUB_ENV}"
          rm -f oidc-error.log

      - name: Publish and independently verify source/readiness
        run: |
          set -euo pipefail
          python tools/publish_hf_space.py \
            --source-dir spaces/szl-model-inference-lab \
            --repo-id SZLHOLDINGS/szl-model-inference-lab \
            --source-revision "${GITHUB_SHA}" \
            --publish \
            --clear-space-volumes \
            --wait-seconds 1800 \
            --smoke-path /live \
            --smoke-path /health \
            --smoke-path /api/build-info \
            --smoke-path /api/v1/identity \
            --smoke-path /api/v2/governed-health \
            --smoke-path /.well-known/szl-inference-contract.json \
            --smoke-path /.well-known/szl-governed-inference-contract.json \
            --smoke-path /v1/models \
            --report reports/model-inference-lab-publication.json

      - name: Exercise live Brain, Forge, Nemo, Formula, and Anatomy path
        run: |
          set -euo pipefail
          python tools/run_governed_live_verifier.py \
            --script spaces/szl-model-inference-lab/verify_governed_live.py \
            --base-url https://szlholdings-szl-model-inference-lab.hf.space \
            --expected-source-revision "${GITHUB_SHA}" \
            --report reports/governed-space-live-verification.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-inference-lab-publication-${{ github.run_id }}
          path: |
            reports/model-inference-lab-publication.json
            reports/governed-space-live-verification.json
          if-no-files-found: error
          retention-days: 90

  publish-bindings:
    name: Verify weights, publish bindings, and read back
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0" "cryptography==49.0.0"

      - name: Run offline contract tests
        env:
          PYTHONPATH: tools
        run: python tools/test_publish_model_source_bindings.py

      - name: Publish and verify exact-source contracts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_ORG_TOKEN }}
        run: >-
          python tools/publish_model_source_bindings.py
          --source-revision "${SOURCE_REVISION}"
          --expected-runtime-source-revision "${SOURCE_REVISION}"
          --publish
          --report reports/model-source-bindings.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-source-bindings-${{ github.run_id }}
          path: reports/model-source-bindings.json
          if-no-files-found: error
          retention-days: 90
