name: Model qualification admission contracts

on:
  pull_request:
    paths:
      - ".github/workflows/model-qualification-admission.yml"
      - "chaski/adapter_guard.py"
      - "chaski/test_adapter_guard.py"
      - "chaski/bakeoff_named_n.py"
      - "frontier/harness/**"
      - "tests/frontier/**"
      - "tests/test_model_qualification_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-qualification-admission.yml"
      - "chaski/adapter_guard.py"
      - "chaski/test_adapter_guard.py"
      - "chaski/bakeoff_named_n.py"
      - "frontier/harness/**"
      - "tests/frontier/**"
      - "tests/test_model_qualification_workflow.py"

permissions:
  contents: read

concurrency:
  group: model-qualification-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Admission (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run dependency-free admission regressions
        run: >-
          python -B -m unittest -v chaski/test_adapter_guard.py
          tests/frontier/test_public_smoke_boundary.py
          tests/frontier/test_strict_draft_contract.py
          tests/frontier/test_binding_admission.py
          tests/frontier/test_binding_gate.py
          tests/test_model_qualification_workflow.py

      - name: Check fail-closed behavior with Python assertions disabled
        run: >-
          python -B -O -m unittest -v chaski/test_adapter_guard.py
          tests/frontier/test_public_smoke_boundary.py
          tests/frontier/test_strict_draft_contract.py
          tests/frontier/test_binding_admission.py
          tests/frontier/test_binding_gate.py
          tests/test_model_qualification_workflow.py
