name: Materialize HF model-binding Retry-After repair once

on:
  push:
    branches:
      - fix/hf-model-binding-retry-after-v1
    paths:
      - .github/workflows/materialize-hf-model-binding-retry-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-hf-model-binding-retry-after-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-model-binding-retry-after-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Materialize bounded provider retry semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("tools/publish_model_source_bindings.py")
          test_path = Path("tests/test_hf_model_binding_retry_after.py")
          source = source_path.read_text(encoding="utf-8")

          class_anchor = (
              'class RuntimeUnavailableBindingError(BindingError):\n'
              '    """Raised when the governed runtime or required route does not exist yet."""\n'
              '\n\n'
          )
          helper = dedent('''
          class RuntimeUnavailableBindingError(BindingError):
              """Raised when the governed runtime or required route does not exist yet."""


          HUB_RETRYABLE_STATUS_CODES = frozenset({429, 500, 502, 503, 504})
          HUB_MODEL_INFO_MAX_ATTEMPTS = 6
          HUB_MODEL_INFO_MAX_DELAY_SECONDS = 180.0
          HUB_MODEL_INFO_TOTAL_SLEEP_BUDGET_SECONDS = 360.0


          def _retry_after_seconds(error: BaseException) -> float | None:
              """Return a bounded numeric Retry-After without exposing request data."""

              response = getattr(error, "response", None)
              headers = getattr(response, "headers", None)
              if headers is None:
                  return None
              value = headers.get("Retry-After") or headers.get("retry-after")
              if value is None:
                  return None
              try:
                  delay = float(str(value).strip())
              except (TypeError, ValueError):
                  return None
              if delay < 0 or not (delay < float("inf")):
                  return None
              return min(delay, HUB_MODEL_INFO_MAX_DELAY_SECONDS)


          def _model_info_with_retry(
              api: HfApi,
              repo_id: str,
              *,
              sleeper: Callable[[float], None] = time.sleep,
              max_attempts: int = HUB_MODEL_INFO_MAX_ATTEMPTS,
              total_sleep_budget_seconds: float = HUB_MODEL_INFO_TOTAL_SLEEP_BUDGET_SECONDS,
              **kwargs: Any,
          ) -> Any:
              """Call model_info with bounded provider-directed retry semantics."""

              if max_attempts < 1:
                  raise ValueError("max_attempts must be positive")
              if total_sleep_budget_seconds < 0:
                  raise ValueError("total_sleep_budget_seconds cannot be negative")

              slept = 0.0
              for attempt in range(1, max_attempts + 1):
                  try:
                      return api.model_info(repo_id, **kwargs)
                  except Exception as error:
                      response = getattr(error, "response", None)
                      status_code = getattr(response, "status_code", None)
                      if status_code not in HUB_RETRYABLE_STATUS_CODES:
                          raise
                      if attempt >= max_attempts:
                          raise TransientBindingError(
                              f"{repo_id}: Hub model metadata retry attempts exhausted "
                              f"after HTTP {status_code}"
                          ) from error

                      directed_delay = _retry_after_seconds(error)
                      delay = (
                          directed_delay
                          if directed_delay is not None
                          else min(float(2 ** (attempt - 1)), 30.0)
                      )
                      if slept + delay > total_sleep_budget_seconds:
                          raise TransientBindingError(
                              f"{repo_id}: Hub model metadata retry budget exhausted "
                              f"after HTTP {status_code}"
                          ) from error
                      sleeper(delay)
                      slept += delay

              raise AssertionError("unreachable Hub retry state")


          ''').lstrip()
          if source.count(class_anchor) != 1:
              raise SystemExit("RuntimeUnavailableBindingError anchor drifted")
          source = source.replace(class_anchor, helper, 1)

          artifact_call = (
              "info = api.model_info(\n"
              '        artifact["repo_id"],\n'
              "        files_metadata=True,\n"
              "        revision=expected_revision,\n"
              "    )"
          )
          artifact_replacement = (
              "info = _model_info_with_retry(\n"
              "        api,\n"
              '        artifact["repo_id"],\n'
              "        files_metadata=True,\n"
              "        revision=expected_revision,\n"
              "    )"
          )
          if source.count(artifact_call) != 1:
              raise SystemExit(
                  f"artifact model_info call drifted; count={source.count(artifact_call)}"
              )
          source = source.replace(artifact_call, artifact_replacement, 1)

          lineage_call = "info = api.model_info(repo_id, revision=revision)"
          lineage_replacement = "info = _model_info_with_retry(api, repo_id, revision=revision)"
          if source.count(lineage_call) != 1:
              raise SystemExit(
                  f"lineage model_info call drifted; count={source.count(lineage_call)}"
              )
          source = source.replace(lineage_call, lineage_replacement, 1)

          tests = dedent('''
          from __future__ import annotations

          import unittest
          from types import SimpleNamespace
          from unittest import mock

          import publish_model_source_bindings as bindings


          class HubModelInfoRetryTests(unittest.TestCase):
              def test_honors_numeric_retry_after(self) -> None:
                  class RateLimitError(RuntimeError):
                      def __init__(self) -> None:
                          super().__init__("rate limited")
                          self.response = SimpleNamespace(
                              status_code=429,
                              headers={"Retry-After": "17"},
                          )

                  expected = SimpleNamespace(sha="a" * 40, siblings=[])
                  api = mock.Mock()
                  api.model_info.side_effect = [RateLimitError(), expected]
                  sleeps: list[float] = []

                  observed = bindings._model_info_with_retry(
                      api,
                      "SZLHOLDINGS/example",
                      sleeper=sleeps.append,
                      max_attempts=3,
                      total_sleep_budget_seconds=30,
                      files_metadata=True,
                  )

                  self.assertIs(observed, expected)
                  self.assertEqual([17.0], sleeps)
                  self.assertEqual(2, api.model_info.call_count)

              def test_does_not_retry_nontransient_denial(self) -> None:
                  class ProviderPermissionError(RuntimeError):
                      def __init__(self) -> None:
                          super().__init__("denied")
                          self.response = SimpleNamespace(status_code=403, headers={})

                  api = mock.Mock()
                  api.model_info.side_effect = ProviderPermissionError()
                  sleeps: list[float] = []

                  with self.assertRaises(ProviderPermissionError):
                      bindings._model_info_with_retry(
                          api,
                          "SZLHOLDINGS/example",
                          sleeper=sleeps.append,
                          max_attempts=3,
                      )

                  self.assertEqual([], sleeps)
                  self.assertEqual(1, api.model_info.call_count)

              def test_fails_closed_when_retry_budget_is_exhausted(self) -> None:
                  class RateLimitError(RuntimeError):
                      def __init__(self) -> None:
                          super().__init__("rate limited")
                          self.response = SimpleNamespace(
                              status_code=429,
                              headers={"Retry-After": "181"},
                          )

                  api = mock.Mock()
                  api.model_info.side_effect = RateLimitError()
                  sleeps: list[float] = []

                  with self.assertRaisesRegex(
                      bindings.TransientBindingError,
                      "retry budget exhausted",
                  ):
                      bindings._model_info_with_retry(
                          api,
                          "SZLHOLDINGS/example",
                          sleeper=sleeps.append,
                          max_attempts=3,
                          total_sleep_budget_seconds=100,
                      )

                  self.assertEqual([], sleeps)
                  self.assertEqual(1, api.model_info.call_count)

              def test_caps_numeric_retry_after(self) -> None:
                  class RateLimitError(RuntimeError):
                      def __init__(self) -> None:
                          super().__init__("rate limited")
                          self.response = SimpleNamespace(
                              status_code=429,
                              headers={"retry-after": "999"},
                          )

                  expected = SimpleNamespace(sha="a" * 40, siblings=[])
                  api = mock.Mock()
                  api.model_info.side_effect = [RateLimitError(), expected]
                  sleeps: list[float] = []

                  bindings._model_info_with_retry(
                      api,
                      "SZLHOLDINGS/example",
                      sleeper=sleeps.append,
                      max_attempts=2,
                      total_sleep_budget_seconds=180,
                  )
                  self.assertEqual([180.0], sleeps)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ''').lstrip()

          source_path.write_text(source, encoding="utf-8", newline="\n")
          test_path.write_text(tests, encoding="utf-8", newline="\n")
          PY

      - name: Prove retry, denial, budget, cap, and existing evidence behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "cryptography==49.0.0" "huggingface-hub==1.23.0"
          python -m py_compile \
            tools/publish_model_source_bindings.py \
            tests/test_hf_model_binding_retry_after.py
          PYTHONPATH=tools python -m unittest -v \
            tests.test_hf_model_binding_retry_after \
            tools.test_publish_model_source_bindings.PublishModelSourceBindingsTests.test_hub_evidence_resolves_pinned_adapter_revision
          git diff --check

      - name: Remove transport and push the clean repair
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/materialize-hf-model-binding-retry-once.yml
          git add \
            tools/publish_model_source_bindings.py \
            tests/test_hf_model_binding_retry_after.py
          git diff --cached --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git commit -s \
            -m "fix(hf): honor Retry-After in model binding evidence" \
            -m "Retry only bounded provider rate-limit/server responses, honor numeric Retry-After values, cap attempts and total sleep, and fail closed for permission or budget failures."
          git push origin HEAD:fix/hf-model-binding-retry-after-v1
