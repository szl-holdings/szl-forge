name: Publish SZL Forge Lab

on:
  push:
    branches: [main]
    paths:
      - "spaces/szl-forge-lab/**"
      - "portfolio/model_portfolio.json"
      - ".github/workflows/publish-forge-lab.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-szl-forge-lab
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish exact static source and verify bytes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Per-asset Hub write lock (HF upgrade plan D3), never keyed by event.
    concurrency:
      group: hf-write/space/SZLHOLDINGS/szl-forge-lab
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication clients
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0"
          "requests==2.32.5"

      - name: Require canonical portfolio byte parity
        run: cmp portfolio/model_portfolio.json spaces/szl-forge-lab/model_portfolio.json

      - name: Verify frozen research release and replay parity before publication
        run: |
          set -euo pipefail
          python foundation-confirmation/build_showcase.py --archive spaces/szl-forge-lab/foundation/data/release.zip --output /tmp/confirmation-showcase
          diff -qr /tmp/confirmation-showcase/data spaces/szl-forge-lab/foundation/data

      - name: Validate existing publisher access to the exact Space
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: >-
          python tools/acquire_hf_publisher_token.py
          --target-repo SZLHOLDINGS/szl-forge-lab --target-type space
          --github-env "${GITHUB_ENV}"
          --report reports/szl-forge-lab-credential.json

      - name: Publish and independently verify
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          python tools/publish_hf_space.py \
            --source-dir spaces/szl-forge-lab \
            --repo-id SZLHOLDINGS/szl-forge-lab \
            --source-revision "${GITHUB_SHA}" \
            --publish \
            --static \
            --wait-seconds 1200 \
            --smoke-path / \
            --smoke-path /index.html \
            --smoke-path /model_portfolio.json \
            --smoke-path /foundation/index.html \
            --smoke-path /foundation/data/catalog.json \
            --report reports/szl-forge-lab-publication.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szl-forge-lab-publication-${{ github.run_id }}
          path: reports/szl-forge-lab-*.json
          if-no-files-found: error
          retention-days: 90
