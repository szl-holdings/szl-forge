name: ReceiptAgent v3 card correction input
on:
  pull_request:
    branches: [main]
    paths:
      - "receiptagent-v3/card/README.md"
      - "tools/prepare_receiptagent_v3_card_sync.py"
      - "tools/publish_receiptagent_v3_public_card.py"
      - "tools/check_receiptagent_v3_card_dispatch.py"
      - "tests/test_receiptagent_v3_card_sync.py"
      - "tests/test_publish_receiptagent_v3_public_card.py"
      - "tests/test_receiptagent_v3_card_dispatch.py"
      - "docs/receiptagent-v3-card-sync-input.md"
      - ".github/workflows/receiptagent-v3-card-sync-input-ci.yml"
      - ".github/workflows/publish-receiptagent-v3-public-card.yml"
  push:
    branches: [main]
    paths:
      - "receiptagent-v3/card/README.md"
      - "tools/prepare_receiptagent_v3_card_sync.py"
      - "tools/publish_receiptagent_v3_public_card.py"
      - "tools/check_receiptagent_v3_card_dispatch.py"
      - "tests/test_receiptagent_v3_card_sync.py"
      - "tests/test_publish_receiptagent_v3_public_card.py"
      - "tests/test_receiptagent_v3_card_dispatch.py"
      - "docs/receiptagent-v3-card-sync-input.md"
      - ".github/workflows/receiptagent-v3-card-sync-input-ci.yml"
      - ".github/workflows/publish-receiptagent-v3-public-card.yml"
permissions:
  contents: read
jobs:
  offline-review-input:
    name: Keep public-card correction source-bound and offline
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Test fail-closed source and card preservation offline
        run: |
          python -B -m unittest discover -s tests -p 'test_*receiptagent_v3*card*.py' -v
          git diff --exit-code
