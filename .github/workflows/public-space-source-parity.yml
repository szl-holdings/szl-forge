name: Public Space exact-source parity (offline negatives and read-only watch)

on:
  pull_request:
    paths:
      - "tools/check_public_space_release_parity.py"
      - "tests/test_check_public_space_release_parity.py"
      - "tools/observe_model_inference_lab_parity.py"
      - "tests/test_observe_model_inference_lab_parity.py"
      - "docs/MODEL_INFERENCE_SPACE_PUBLIC_RELEASE_PARITY_20261121.md"
      - ".github/workflows/public-space-source-parity.yml"
  push:
    branches: [main]
    paths:
      - "tools/check_public_space_release_parity.py"
      - "tests/test_check_public_space_release_parity.py"
      - "tools/observe_model_inference_lab_parity.py"
      - "tests/test_observe_model_inference_lab_parity.py"
      - "docs/MODEL_INFERENCE_SPACE_PUBLIC_RELEASE_PARITY_20261121.md"
      - ".github/workflows/public-space-source-parity.yml"
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile stdlib diagnostic and test no-network negative controls
        run: |
          python -m py_compile tools/check_public_space_release_parity.py tools/observe_model_inference_lab_parity.py
          python -m unittest discover -s tests -p "test_check_public_space_release_parity.py" -v
          python -m unittest discover -s tests -p "test_observe_model_inference_lab_parity.py" -v

  observe-live-public-parity:
    needs: offline-source-guard
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Observe immutable public Hub source without credentials
        run: |
          mkdir -p reports
          python -B tools/observe_model_inference_lab_parity.py \
            --source-dir spaces/szl-model-inference-lab \
            > reports/model-inference-lab-parity.json
      - name: Retain scoped report even when drift fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-inference-lab-parity-${{ github.run_id }}
          path: reports/model-inference-lab-parity.json
          if-no-files-found: warn
          retention-days: 30
