name: Curated model card input
on:
  pull_request:
    branches: [main]
    paths:
      - "publishing/curated-model-card-profiles.json"
      - "publishing/curated-card-observations/**"
      - "tools/prepare_curated_model_card.py"
      - "tests/test_prepare_curated_model_card.py"
      - "docs/curated-model-card-publication.md"
      - "willay/card/README.md"
      - ".github/workflows/curated-model-card-input-ci.yml"
  push:
    branches: [main]
    paths:
      - "publishing/curated-model-card-profiles.json"
      - "publishing/curated-card-observations/**"
      - "tools/prepare_curated_model_card.py"
      - "tests/test_prepare_curated_model_card.py"
      - "docs/curated-model-card-publication.md"
      - "willay/card/README.md"
      - ".github/workflows/curated-model-card-input-ci.yml"
permissions:
  contents: read
jobs:
  offline-input:
    name: Preserve card bytes and pinned metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Offline fixtures and default no-write preparation
        run: |
          python -B -m unittest discover -s tests -p test_prepare_curated_model_card.py -v
          python -B tools/prepare_curated_model_card.py --profile willay
          git diff --exit-code
