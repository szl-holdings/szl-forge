name: Publish model source bindings

on:
  push:
    branches: [main]
    paths:
      - "publishing/model-source-bindings.json"
      - "tools/publish_model_source_bindings.py"
      - "tools/test_publish_model_source_bindings.py"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Publish model inference lab"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-model-source-bindings
  cancel-in-progress: false

jobs:
  publish:
    name: Verify weights, publish bindings, and read back
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0" "cryptography==49.0.0"

      - name: Run offline contract tests
        env:
          PYTHONPATH: tools
        run: python tools/test_publish_model_source_bindings.py

      - name: Publish and verify exact-source contracts
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
        run: >-
          python tools/publish_model_source_bindings.py
          --source-revision "${SOURCE_REVISION}"
          --publish
          --report reports/model-source-bindings.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-source-bindings-${{ github.run_id }}
          path: reports/model-source-bindings.json
          if-no-files-found: error
          retention-days: 90
