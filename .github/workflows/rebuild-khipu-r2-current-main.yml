name: Rebuild KHIPU-R2 on current main

on:
  push:
    branches:
      - fix/khipu-r2-hub-facts-current-main-20260828

permissions:
  contents: write

concurrency:
  group: rebuild-khipu-r2-current-main-20260828
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'szl-holdings/szl-forge' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Import the exact KHIPU-R2 files and preserve current portfolio rows
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin cec43f8776edc1cbb52d9b8259f8fdfadd9930e9
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = "cec43f8776edc1cbb52d9b8259f8fdfadd9930e9"
          paths = (
              "khipu_r2/README.md",
              "khipu_r2/eval_khipu_r2.py",
              "khipu_r2/jobs/launch_khipu_r2_job.py",
              "khipu_r2/serve_khipu_r2.py",
              "khipu_r2/test_khipu_r2.py",
              "khipu_r2/train_khipu_r2.py",
              "tools/test_fall2026_alignment.py",
          )
          for relative in paths:
              data = subprocess.check_output(["git", "show", f"{source}:{relative}"])
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          readme_path = Path("README.md")
          current = readme_path.read_text(encoding="utf-8")
          predecessor = subprocess.check_output(
              ["git", "show", f"{source}:README.md"], text=True, encoding="utf-8"
          )

          def exact_row(text: str, prefix: str) -> str:
              rows = [line for line in text.splitlines() if line.startswith(prefix)]
              if len(rows) != 1:
                  raise SystemExit(f"expected one row beginning {prefix!r}, found {len(rows)}")
              return rows[0]

          prefix = "| [`KHIPU-R2`](./khipu_r2/)"
          old_row = exact_row(current, prefix)
          new_row = exact_row(predecessor, prefix)
          if old_row == new_row:
              raise SystemExit("current main already contains the exact KHIPU-R2 row")
          current = current.replace(old_row, new_row, 1)
          if current.count("| [`SZLHOLDINGS/chakana`](./chakana/)") != 1:
              raise SystemExit("current-main Chakana portfolio row was not preserved exactly")
          readme_path.write_text(current, encoding="utf-8")

          workflow = Path(".github/workflows/rebuild-khipu-r2-current-main.yml")
          if not workflow.is_file():
              raise SystemExit("bounded rebuild workflow is missing")
          workflow.unlink()
          PY

      - name: Verify the exact KHIPU-R2 successor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            khipu_r2/eval_khipu_r2.py \
            khipu_r2/jobs/launch_khipu_r2_job.py \
            khipu_r2/serve_khipu_r2.py \
            khipu_r2/test_khipu_r2.py \
            khipu_r2/train_khipu_r2.py \
            tools/test_fall2026_alignment.py
          python3 -m unittest -v khipu_r2.test_khipu_r2 tools.test_fall2026_alignment
          git diff --check

      - name: Commit the current-main successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git commit \
            -m "fix(khipu-r2): bind measured Hub facts on current main" \
            -m "Preserve the Chakana portfolio row while importing the exact reviewed KHIPU-R2 source, tests, CHAWPI execution lock, and truthful 3/6 abstention evidence. Remove this bounded rebuild workflow from the final tree." \
            -m "Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"
