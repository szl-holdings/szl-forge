name: Materialize HF ORG TOKEN1 fallback once

on:
  push:
    branches:
      - fix/hf-org-token1-fallback-v1
    paths:
      - .github/workflows/materialize-hf-org-token1-fallback-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-hf-org-token1-fallback-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-org-token1-fallback-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Materialize and prove the selector chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/hf-org-token1-fallback-v1"
          python -B -m py_compile \
            tools/acquire_hf_publisher_token.py \
            tools/materialize_hf_org_token1_fallback.py \
            tests/test_acquire_hf_publisher_token.py \
            tests/test_hf_org_token1_fallback.py
          python -B tools/materialize_hf_org_token1_fallback.py
          python -B tests/test_acquire_hf_publisher_token.py
          python -B tests/test_hf_org_token1_fallback.py
          git diff --check HEAD
          test "$(grep -Fc 'HF_ORG_TOKEN1_CANDIDATE' .github/workflows/publish-model-inference-lab.yml)" -eq 2
          grep -Fq '("HF_ORG_TOKEN1", "HF_ORG_TOKEN1_CANDIDATE")' tools/acquire_hf_publisher_token.py

      - name: Remove temporary machinery and push clean branch head
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/materialize-hf-org-token1-fallback-once.yml \
            tools/materialize_hf_org_token1_fallback.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(deploy): validate the alternate organization publisher token' \
            -m 'Insert HF_ORG_TOKEN1 after the primary organization token and before broader fallbacks, wire it into both publication jobs, and prove an expired primary token cannot mask the valid alternate.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/hf-org-token1-fallback-v1
