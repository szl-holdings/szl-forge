name: Qualify retained compatibility kernels

on:
  pull_request:
    paths:
      - publishing/compatibility-kernels.json
      - tools/publish_compatibility_kernels.py
      - tools/test_publish_compatibility_kernels.py
      - .github/workflows/publish-compatibility-kernels.yml
  push:
    branches: [main]
    paths:
      - publishing/compatibility-kernels.json
      - tools/publish_compatibility_kernels.py
      - tools/test_publish_compatibility_kernels.py
      - .github/workflows/publish-compatibility-kernels.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compatibility-kernels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check "huggingface-hub==1.23.0"
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0"
      - name: Run offline regression tests
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_publish_compatibility_kernels.py
      - name: Qualify pinned public kernel
        run: python tools/publish_compatibility_kernels.py --report reports/compatibility-kernels.json
      - name: Publish after protected-main merge
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
        run: python tools/publish_compatibility_kernels.py --publish --report reports/compatibility-kernels-published.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-kernel-evidence-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 90
