name: HF core stack evaluation contract

on:
  pull_request:
    paths:
      - "tools/hf_core_stack_guard.py"
      - "tools/test_hf_core_stack_guard.py"
      - "tools/hf_core_stack_receipt.py"
      - "tools/evaluate_hf_tooling.py"
      - "inference/hf_tooling.py"
      - ".github/workflows/hf-core-stack-eval.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: hf-core-stack-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Run fail-closed core-stack contract tests
        working-directory: tools
        run: python -m unittest -v test_hf_core_stack_guard.py
      - name: Emit bounded plan
        working-directory: tools
        run: python hf_core_stack_guard.py > ../artifacts-core-stack-plan.json
      - name: Upload contract plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hf-core-stack-contract-plan
          path: artifacts-core-stack-plan.json

  standalone:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install evaluator runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install --no-cache-dir -e .
          python -m pip install --no-cache-dir \
            "huggingface-hub @ git+https://github.com/huggingface/huggingface_hub.git@495b17c8529614759ae0f1ccf1ebe9a61c148b7c" \
            "transformers @ git+https://github.com/huggingface/transformers.git@856157a2f3e9594954310df18fdccc31ffddebe9" \
            "accelerate @ git+https://github.com/huggingface/accelerate.git@6afc1e5ee217051fde702b23de2813344dc0fd33" \
            "trl @ git+https://github.com/huggingface/trl.git@3d9261f1fec9f9a8140099c78a65c7da73dce79c"
      - name: Run exact-source standalone matrix
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p artifacts/hf-tooling
          python -m tools.evaluate_hf_tooling run --lane trl --output artifacts/hf-tooling/report.json
          python -m tools.evaluate_hf_tooling verify --lane trl --output artifacts/hf-tooling/report.json --expected-source "$(git rev-parse HEAD)"
      - name: Seal measured receipt
        if: always()
        run: |
          mkdir -p artifacts/hf-core-stack
          python -m tools.hf_core_stack_receipt \
            --report artifacts/hf-tooling/report.json \
            --output artifacts/hf-core-stack/receipt.json
      - name: Upload standalone evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hf-core-stack-standalone-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn


