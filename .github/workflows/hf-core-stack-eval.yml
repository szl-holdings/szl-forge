name: HF core stack evaluation contract

on:
  pull_request:
    paths:
      - "tools/hf_core_stack_guard.py"
      - "tools/test_hf_core_stack_guard.py"
      - ".github/workflows/hf-core-stack-eval.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run fail-closed core-stack contract tests
        working-directory: tools
        run: python -m unittest -v test_hf_core_stack_guard.py
      - name: Emit bounded plan
        working-directory: tools
        run: python hf_core_stack_guard.py
