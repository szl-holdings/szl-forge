name: Omen cards identity note (Hub PRs)

# Owner-directed WO1 finisher for the three Hub-PR-managed model cards
# (khipu-r3, brain-navigator-r2, szl-receiptagent-qwen35-0.8b-v3).
#
# dry-run       -> diffs + receipt only, no credential is even acquired. The daily schedule
#                  runs exactly this and fails on drift, so WO1 stays a checked invariant.
# pull-request  -> acquires the validated estate publisher credential the same way
#                  hub-honesty-banners-via-token1.yml does, then runs
#                  `cards --apply --owner-authorized`, which can ONLY open Hub pull
#                  requests. Nothing changes on any card until a merge on the Hub.
#                  Direct commits are impossible from this workflow.
# merge         -> merges ONLY the Hub pull requests named in `merge_prs`, and only
#                  when each one is still open, carries the exact identity-note title,
#                  was opened by the same publisher identity, and its diff adds lines
#                  to README.md alone (no removals, no other files). Anything else is
#                  refused and recorded. This is the owner's merge decision executed
#                  with the estate credential; it never merges "all open PRs".
# publish-curated-card -> prepares the WILLAY candidate with the repository's own offline
#                  tool (tools/prepare_curated_model_card.py, hash-bound to the reviewed
#                  profile) and opens ONE Hub pull request that replaces README.md with
#                  those exact bytes. The run prints candidate_sha256; nothing merges here.
#                  In merge mode, `expected_readme_sha256` swaps the additive-note rule for
#                  a byte-exact rule: the PR README must hash to that value and carry the marker.
#
# The pipeline is fetched at an exact commit and its bytes are verified against the
# supplied SHA-256 before anything runs. Publisher-managed cards (chaski-*, KHIPU-R2,
# WILLAY) are refused by the tool itself and route through their source cards.

on:
  schedule:
    - cron: "17 13 * * *"   # daily 13:17 UTC: dry-run drift gate only (no credential, no writes)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (diffs only) or pull-request (open Hub PRs)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - pull-request
          - merge
          - publish-curated-card
      merge_prs:
        description: "merge mode only: comma-separated <owner/repo>#<num> Hub pull requests to merge"
        required: false
        default: ""
      expected_readme_sha256:
        description: "merge mode only, optional: require the PR README to hash to this value (byte-exact curated card) instead of the additive-note rule"
        required: false
        default: ""
      pipeline_sha:
        description: "szl-forge commit holding tools/szl_omen_pipeline.py (huggingface lineage)"
        required: true
        default: "6c35dbca7966cedd948ca2fd755e94cdb3ea3fbe"
      pipeline_sha256:
        description: "Expected SHA-256 of tools/szl_omen_pipeline.py at that commit"
        required: true
        default: "31d5d1bb33f81d9b4ab20f9ba9054741bec8183e45788a99f0e77fe50f58d1ca"

permissions:
  contents: read
  id-token: write

concurrency:
  group: omen-cards-identity-note
  cancel-in-progress: false

jobs:
  cards:
    name: Identity-note diffs, then Hub PRs only when requested
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode || 'dry-run' }}
      PIPELINE_SHA: ${{ inputs.pipeline_sha || '6c35dbca7966cedd948ca2fd755e94cdb3ea3fbe' }}
      PIPELINE_SHA256: ${{ inputs.pipeline_sha256 || '31d5d1bb33f81d9b4ab20f9ba9054741bec8183e45788a99f0e77fe50f58d1ca' }}
      MERGE_PRS: ${{ inputs.merge_prs }}
      EXPECTED_README_SHA256: ${{ inputs.expected_readme_sha256 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Hub client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0"

      - name: Fetch the pinned pipeline and verify its bytes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PIPELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pipeline_sha must be a 40-hex commit"; exit 1; }
          [[ "$PIPELINE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::pipeline_sha256 must be 64 hex"; exit 1; }
          git fetch --depth 1 origin "$PIPELINE_SHA"
          mkdir -p reports
          git show "$PIPELINE_SHA:tools/szl_omen_pipeline.py" > reports/szl_omen_pipeline.py
          echo "$PIPELINE_SHA256  reports/szl_omen_pipeline.py" | sha256sum --check
          echo "pipeline bytes verified at $PIPELINE_SHA"

      - name: Dry-run diffs and receipt (always)
        shell: bash
        run: |
          set -euo pipefail
          python reports/szl_omen_pipeline.py cards --all --out reports/cards-dry-run
          python - <<'PY'
          import json
          receipt = json.load(open("reports/cards-dry-run/cards_receipt.json", encoding="utf-8"))
          for item in receipt["items"]:
              print(item["repo"], "@", item["revision"][:10], "|", item["managed_by"], "|", "; ".join(item["changes"]))
          PY

      - name: Card drift gate (dry-run mode only; the scheduled run exists for this)
        if: env.MODE == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          receipt = json.load(open("reports/cards-dry-run/cards_receipt.json", encoding="utf-8"))
          drift = [i for i in receipt["items"] if i["changes"] and not i["changes"][0].startswith(("NOOP", "SKIP"))]
          for i in drift:
              print(f"::error::card drift: {i['repo']} @ {i['revision'][:10]} -> {'; '.join(i['changes'])}")
          print(f"cards checked={len(receipt['items'])} drift={len(drift)}")
          sys.exit(1 if drift else 0)
          PY

      - name: Acquire validated publisher credential
        if: env.MODE == 'pull-request' || env.MODE == 'merge' || env.MODE == 'publish-curated-card'
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/acquire_hf_publisher_token.py \
            --target-repo SZLHOLDINGS/khipu-r3 \
            --target-type model \
            --github-env "${GITHUB_ENV}" \
            --report reports/cards-publisher-credential.json

      - name: Open Hub pull requests (owner-authorized; never direct commits)
        if: env.MODE == 'pull-request'
        shell: bash
        run: |
          set -euo pipefail
          python reports/szl_omen_pipeline.py cards --apply --owner-authorized --out reports/cards-pull-requests
          python - <<'PY'
          import json
          receipt = json.load(open("reports/cards-pull-requests/cards_receipt.json", encoding="utf-8"))
          print("wo6_status:", receipt["wo6_status"])
          for item in receipt["items"]:
              print(item["repo"], "|", item["mode"], "|", item.get("result_url", "-"))
          PY

      - name: Prepare the WILLAY curated candidate and open one Hub pull request
        if: env.MODE == 'publish-curated-card'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/willay-candidate
          python tools/prepare_curated_model_card.py --profile willay --output-dir reports/willay-candidate
          python - <<'PY'
          import hashlib, json, time
          from huggingface_hub import HfApi, CommitOperationAdd, hf_hub_download
          repo = "SZLHOLDINGS/WILLAY"
          receipt = json.load(open("reports/willay-candidate/receipt.json", encoding="utf-8"))
          candidate = open("reports/willay-candidate/README.md", "rb").read()
          sha = hashlib.sha256(candidate).hexdigest()
          assert sha == receipt["candidate_sha256"], "candidate bytes do not match the preparation receipt"
          api = HfApi()
          info = api.model_info(repo)
          live = open(hf_hub_download(repo, "README.md", repo_type="model", revision=info.sha, force_download=True), "rb").read()
          out = {"stage": "publish-curated-card", "repo": repo, "hub_revision_before": info.sha, "candidate_sha256": sha,
                 "live_readme_sha256": hashlib.sha256(live).hexdigest(), "reviewed_source_revision": receipt["reviewed_source_revision"],
                 "source_sha256": receipt["source_sha256"], "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          if live == candidate:
              out["result"] = "NOOP: Hub README already equals the prepared candidate"
          else:
              open_prs = [d for d in api.get_repo_discussions(repo, repo_type="model", discussion_type="pull_request", discussion_status="open")
                          if d.title.startswith("card: publish the reviewed curated card")]
              if open_prs:
                  out["result"] = f"EXISTS: open curated-card PR #{open_prs[0].num}"; out["pr_num"] = open_prs[0].num
              else:
                  r = api.create_commit(repo_id=repo, repo_type="model", operations=[CommitOperationAdd("README.md", candidate)],
                                        commit_message="card: publish the reviewed curated card (szl-forge willay/card/README.md, metadata/prose only)",
                                        commit_description=("Byte-exact candidate prepared by tools/prepare_curated_model_card.py at szl-holdings/szl-forge "
                                                            f"reviewed_source_revision {receipt['reviewed_source_revision']}; candidate sha256 {sha}. "
                                                            "States the exact reviewed artifacts (both adapters and the derived merge); adds no evaluation claim; "
                                                            "release/promotion holds unchanged."),
                                        parent_commit=info.sha, create_pr=True)
                  out["result"] = "PULL_REQUEST_OPENED"; out["pr_url"] = getattr(r, "pr_url", None); out["pr_num"] = getattr(r, "pr_num", None)
          json.dump(out, open("reports/willay-candidate/publish_receipt.json", "w", encoding="utf-8"), indent=2)
          print(json.dumps(out, indent=2))
          PY

      - name: Merge the named identity-note Hub pull requests (owner decision; strict checks)
        if: env.MODE == 'merge'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/cards-merge
          python - <<'PY'
          import difflib, hashlib, json, os, re, sys, time
          from huggingface_hub import HfApi, hf_hub_download

          TITLE = "card: note the merged root checkpoint alongside the adapter (metadata only)"
          CURATED_TITLE = "card: publish the reviewed curated card"
          MARKER = "<!-- szl:artifact-identity-reconciled -->"
          spec = os.environ.get("MERGE_PRS", "").strip()
          if not spec:
              print("::error::merge mode requires merge_prs"); sys.exit(2)
          api = HfApi()
          me = api.whoami()["name"]
          receipt = {"stage": "cards-merge", "publisher_identity": me, "items": [], "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          failed = False
          for item in [x.strip() for x in spec.split(",") if x.strip()]:
              m = re.fullmatch(r"([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)#(\d+)", item)
              rec = {"spec": item, "result": "REFUSED", "reasons": []}
              receipt["items"].append(rec)
              if not m:
                  rec["reasons"].append("malformed spec"); failed = True; continue
              repo, num = m.group(1), int(m.group(2))
              d = api.get_discussion_details(repo, num, repo_type="model")
              if not d.is_pull_request: rec["reasons"].append("not a pull request")
              if d.status != "open": rec["reasons"].append(f"status is {d.status}, not open")
              expected = os.environ.get("EXPECTED_README_SHA256", "").strip().lower()
              if expected and not re.fullmatch(r"[0-9a-f]{64}", expected):
                  rec["reasons"].append("expected_readme_sha256 must be 64 hex")
              if expected:
                  if not d.title.startswith(CURATED_TITLE): rec["reasons"].append(f"title mismatch for curated publish: {d.title!r}")
              elif d.title != TITLE: rec["reasons"].append(f"title mismatch: {d.title!r}")
              if d.author != me: rec["reasons"].append(f"opened by {d.author!r}, not the publisher identity")
              # Diff computed from the trees themselves (the discussion API does not return one): every blob that
              # differs between main and refs/pr/N is a touched file; README.md is compared line by line.
              def blobs(rev):
                  return {f.path: f.blob_id for f in api.list_repo_tree(repo, revision=rev, repo_type="model", recursive=True) if hasattr(f, "blob_id")}
              main_tree, pr_tree = blobs("main"), blobs(f"refs/pr/{num}")
              files = sorted(pth for pth in set(main_tree) | set(pr_tree) if main_tree.get(pth) != pr_tree.get(pth))
              if files != ["README.md"]: rec["reasons"].append(f"pull request touches {files}, not README.md alone")
              before = open(hf_hub_download(repo, "README.md", repo_type="model", revision="main", force_download=True), encoding="utf-8").read().splitlines()
              after_pr = open(hf_hub_download(repo, "README.md", repo_type="model", revision=f"refs/pr/{num}", force_download=True), encoding="utf-8").read().splitlines()
              hunk = list(difflib.unified_diff(before, after_pr, lineterm="", n=0))
              added = [ln for ln in hunk if ln.startswith("+") and not ln.startswith("+++")]
              removed = [ln for ln in hunk if ln.startswith("-") and not ln.startswith("---")]
              pr_bytes = open(hf_hub_download(repo, "README.md", repo_type="model", revision=f"refs/pr/{num}", force_download=True), "rb").read()
              if expected:
                  got = hashlib.sha256(pr_bytes).hexdigest()
                  if got != expected: rec["reasons"].append(f"PR README sha256 {got[:12]} != expected {expected[:12]} (not the reviewed curated bytes)")
                  if MARKER not in pr_bytes.decode("utf-8", "replace"): rec["reasons"].append("curated card lacks the identity marker")
                  rec["rule"] = "byte-exact curated card"
              else:
                  if removed: rec["reasons"].append(f"diff removes {len(removed)} line(s); identity note must be additive")
                  if not added or not any(MARKER in ln for ln in added): rec["reasons"].append("diff does not add the identity-note marker")
                  if MARKER in "\n".join(before): rec["reasons"].append("main already carries the marker; merge would duplicate it")
                  rec["rule"] = "additive identity note"
              rec.update({"repo": repo, "num": num, "title": d.title, "author": d.author, "added_lines": len(added), "removed_lines": len(removed)})
              if rec["reasons"]:
                  failed = True; print(f"REFUSED {item}: {rec['reasons']}"); continue
              api.merge_pull_request(repo, num, repo_type="model",
                                     comment=("Merged under explicit owner authorization (2026-09-30). " + ("Byte-exact reviewed curated card from szl-holdings/szl-forge; no evaluation claim added." if expected else "Additive artifact-identity note; no evaluation claim, frontmatter unchanged.")))
              after = api.get_discussion_details(repo, num, repo_type="model")
              readme = open(hf_hub_download(repo, "README.md", repo_type="model", revision="main", force_download=True), encoding="utf-8").read()
              rec["status_after"] = after.status
              rec["marker_on_main"] = MARKER in readme
              rec["result"] = "MERGED" if after.status == "merged" and MARKER in readme else "MERGE_UNVERIFIED"
              if rec["result"] != "MERGED": failed = True
              print(f"{rec['result']} {item} (main carries marker: {rec['marker_on_main']})")
          json.dump(receipt, open("reports/cards-merge/merge_receipt.json", "w", encoding="utf-8"), indent=2)
          sys.exit(1 if failed else 0)
          PY

      - name: Upload sanitized receipts and diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omen-cards-identity-note-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
