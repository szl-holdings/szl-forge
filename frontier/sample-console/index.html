<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>a11oy Frontier SAMPLE — operator console</title>
  <meta name="description" content="SAMPLE public baseline. Refuses to mint alignment from missing evidence. Not a live a-11-oy.com deployment. Signer ABSENT. Lambda Conjecture 1." />
  <link rel="icon" type="image/svg+xml" href="szl/logos/szl_favicon.svg" />
  <link rel="stylesheet" href="szl/szl-design-system.css" />
  <link rel="stylesheet" href="szl/szl-console.css" />
  <style>
    /* SZL KANCHAY v1.1.0, founder direction (vendored in ./szl/). Dark operator surface.
       Every color, face, radius and space is a founder token. One coral moment per view. */
    :where(a, button):focus-visible { outline: var(--border-focus) solid var(--focus); outline-offset: 2px }
    header, main { max-width: var(--container); margin-inline: auto; padding: var(--space-4) }
    header { padding-top: var(--space-6) }
    main > :first-child { margin-top: var(--space-2) }

    .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); max-width: none; margin: 0 0 var(--space-4) }
    /* Small chip text sits on --bg-deep, where --text-ghost passes (5.29:1; 4.37:1 on --surface-alt). */
    .chips .chip { background: var(--bg-deep) }
    h1.page-head__title { margin: 0 0 var(--space-2) }
    main h2 { margin: var(--space-6) 0 var(--space-2); font-size: var(--text-xl) }
    p { text-wrap: pretty }
    .note { color: var(--text-sub) }
    code { color: var(--text) }

    .btn { min-block-size: var(--target-size-coarse) }
    .dock { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); padding-bottom: var(--space-4); border-bottom: var(--border-hairline) solid var(--hairline) }
    .dock .btn.on { color: var(--text); background: var(--surface-raised); border-color: var(--border) }
    /* The active-nav dot is the view's one coral moment, except where a .btn-primary (loom Submit) is. */
    .dock .btn.on::after { content: ""; inline-size: 6px; block-size: 6px; flex: none; border-radius: var(--radius-full); background: var(--accent) }
    body:has(.btn-primary) .dock .btn.on::after { content: none }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-2) }
    .case-btn { white-space: normal; text-align: left; justify-content: flex-start; line-height: var(--leading-snug) }
    .palette { margin: var(--space-4) 0 0 }

    .table-wrap { overflow-x: auto; margin: var(--space-3) 0 var(--space-4); border: var(--border-hairline) solid var(--border); border-radius: var(--radius-md) }
    .table { font-variant-numeric: tabular-nums lining-nums }
    .table th { background: var(--surface-alt) }
    .table th, .table td { vertical-align: top }
    .table tbody tr:last-child td { border-bottom: 0 }
    .table td:last-child { color: var(--text-sub); overflow-wrap: anywhere }
    .table td:nth-child(2) { white-space: nowrap }
    .table td .note { display: block; margin-top: var(--space-1); color: var(--text-ghost); font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-caps); text-transform: uppercase }
    @media (max-width: 560px) {
      .table, .table tbody { display: block }
      .table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
      .table tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: var(--border-hairline) solid var(--border-subtle) }
      .table tbody tr:last-child { border-bottom: 0 }
      .table td { padding: 0; border-bottom: 0 }
      .table td:nth-child(2) { text-align: right }
      .table td:last-child { grid-column: 1 / -1; margin-top: var(--space-2) }
    }

    /* Status is always the word (a .chip in tables); the ink only reinforces it. */
    .INCOMPLETE, .DIVERGENT, .SMOKE_FAIL, .UNAVAILABLE,
    :is(.INCOMPLETE, .DIVERGENT, .SMOKE_FAIL, .UNAVAILABLE) > .chip { color: var(--ink-bad) }
    .HOLD, .UNRUN, :is(.HOLD, .UNRUN) > .chip { color: var(--ink-warn) }
    .PASS, .MEASURED, :is(.PASS, .MEASURED) > .chip { color: var(--ink-good) }

    .ribbon { display: block; width: 100%; height: auto; margin-bottom: var(--space-3); background: var(--bg-deep); border: var(--border-hairline) solid var(--border); border-radius: var(--radius-md) }
    .ribbon-band { fill: color-mix(in srgb, var(--color-silver-300) 22%, transparent) }
    .ribbon-line { fill: none; stroke: var(--color-silver-300); stroke-width: 2 }
    .ribbon-cut { stroke: var(--color-silver-500); stroke-dasharray: 4 4 }

    #loom-in { display: block; min-block-size: 72px; margin-bottom: var(--space-3); resize: vertical }
    #loom-msg { font-family: var(--font-mono); font-size: var(--text-sm); font-variant-numeric: tabular-nums lining-nums; overflow-wrap: anywhere }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <p class="chips"><span class="chip chip-sample">SAMPLE</span><span class="chip chip-unavailable">signer ABSENT</span><span class="chip chip-conjecture">Λ Conjecture 1</span><span class="chip">production authorized false</span></p>
    <h1 class="page-head__title">a11oy Frontier</h1>
    <p class="note">Operator console that refuses to mint alignment from missing evidence. Not a live a-11-oy.com deployment. Not production admission. ⌘K jumps any surface.</p>
    <nav class="dock" id="dock" aria-label="Surfaces"></nav>
  </header>
  <main id="main"></main>
  <script>
    const PACKAGES = [
      { id: "mesh-v5", title: "Forge #239 live-mesh V5 HTML-metrics", status: "INCOMPLETE", note: "Do not merge unchanged. HTML 200 metrics is not ALIGNED." },
      { id: "loom", title: "Lyte Forecast Loom SAMPLE", status: "PASS", note: "Caller-supplied inspect. Not Granite. Not MEASURED." },
      { id: "minicpm", title: "MiniCPM held-out smoke", status: "HOLD", note: "9/12 SMOKE_FAIL locked. Historical failures may not be upgraded." },
      { id: "deepseek", title: "DeepSeek V4.1 Flash", status: "HOLD", note: "Missing metrics UNAVAILABLE, not zero." },
      { id: "nex", title: "Nex Mini", status: "HOLD", note: "Missing metrics UNAVAILABLE, not zero." },
      { id: "kernels", title: "Kernel Hub inventory", status: "INCOMPLETE", note: "Four missing v1 names labeled. No deletions." },
      { id: "gpu-243", title: "AsyncGRPO GPU runner #243", status: "UNRUN", note: "Generation UNAVAILABLE without local weights." },
    ];
    const DOUBLES = [
      { id: "html-metrics", title: "HTML 200 metrics", verdict: "INCOMPLETE", detail: "text/html 200 on /api/lyte/v2/metrics. Not a metrics object. Sibling cannot ride a green parent." },
      { id: "empty-metrics", title: "Empty JSON metrics on green parent", verdict: "INCOMPLETE", detail: "200 {} while identities match. lyte_source_parity:INCOMPLETE." },
      { id: "404-sha", title: "404 with a SHA", verdict: "DIVERGENT", detail: "Error body sha is not identity. IDENTITY_FROM_ERROR_REFUSED." },
      { id: "missing-proof", title: "Missing proof document", verdict: "INCOMPLETE", detail: "One of two health.json reads 404. STATIC_DOCUMENT needs both." },
      { id: "skipped-sibling", title: "Skipped sibling", verdict: "INCOMPLETE", detail: "503 metrics while GitHub/pin/space match. No green parent ride." },
      { id: "string-true", title: "bindings_agree: \"true\"", verdict: "DIVERGENT", detail: "Literal true required. String true is not observed." },
      { id: "conflict-alias", title: "Conflicting runtime aliases", verdict: "DIVERGENT", detail: "source_revision ≠ build.revision. CONFLICT, no first-alias win." },
    ];
    const LANES = [
      { id: "minicpm-gguf", title: "MiniCPM5 GGUF", status: "SMOKE_FAIL", note: "passedCases 9 / 12. Do not upgrade the historical fail." },
      { id: "deepseek-v41-flash", title: "DeepSeek V4.1 Flash", status: "HOLD", note: "UNAVAILABLE metrics, not 0." },
      { id: "nex-mini", title: "Nex Mini", status: "HOLD", note: "UNAVAILABLE metrics, not 0." },
      { id: "khipu-abstain", title: "Khipu abstain", status: "HOLD", note: "Research-only. Not a winner." },
    ];
    const KERNELS = [
      { name: "native locked-8", kind: "native", status: "MEASURED", note: "c7c0ba17 doctrine lock. Not Hub deletion." },
      { name: "model-mirror", kind: "mirror", status: "HOLD", note: "Mirror ≠ native kernel-type v1." },
      { name: "szl-maskmod", kind: "missing-v1", status: "UNAVAILABLE", note: "Labeled missing. No Hub delete." },
      { name: "szl-block-kv", kind: "missing-v1", status: "UNAVAILABLE", note: "Labeled missing. No Hub delete." },
      { name: "szl-receipt-attn", kind: "missing-v1", status: "UNAVAILABLE", note: "Labeled missing. No Hub delete." },
      { name: "YARQA-ATTN", kind: "missing-v1", status: "UNAVAILABLE", note: "Labeled missing. No Hub delete." },
    ];
    const APPS = ["command", "lyte", "mesh", "frontier", "kernels"];
    let surface = "command";
    let meshCase = null;
    let palette = false;
    let loomMsg = "";

    function sampleSeries() {
      const y = [];
      for (let i = 0; i < 24; i++) {
        y.push(i === 7 || i === 8 ? null : 10 + Math.sin(i / 3) * 2 + (i > 16 ? 0.4 * (i - 16) : 0));
      }
      return y;
    }
    const SERIES = sampleSeries();

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function ribbon() {
      const w = 1000, h = 180, pad = 16;
      const vals = SERIES.map((v, i) => ({ i, v }));
      const nums = SERIES.filter((v) => v != null);
      const min = Math.min(...nums) - 2, max = Math.max(...nums) + 2;
      const x = (i) => pad + i * ((w - 2 * pad) / (SERIES.length - 1));
      const y = (v) => h - pad - ((v - min) / (max - min)) * (h - 2 * pad);
      const line = SERIES.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean).join(" ");
      const p10 = SERIES.map((v, i) => v == null ? "" : `${x(i)},${y(v - 1.6)}`).join(" ");
      const p90 = SERIES.map((v, i) => v == null ? "" : `${x(i)},${y(v + 1.6)}`).reverse().join(" ");
      return `<svg class="ribbon" viewBox="0 0 ${w} ${h}" role="img" aria-label="SAMPLE uncalibrated p10-p90 ribbon">
        <polygon class="ribbon-band" points="${p10} ${p90}"></polygon>
        <polyline class="ribbon-line" points="${line}"></polyline>
        <line class="ribbon-cut" x1="${x(18)}" x2="${x(18)}" y1="${pad}" y2="${h-pad}"></line>
      </svg><p class="note">SAMPLE series. Gaps are missing data. Ribbon is uncalibrated p10–p90. Holdout pinball/coverage are not a production certificate. Not Granite.</p>`;
    }

    function table(rows) {
      return `<div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Status</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function render() {
      const dock = document.getElementById("dock");
      dock.innerHTML = APPS.map((id) => `<button type="button" class="btn btn-ghost${surface===id?" on":""}"${surface===id?' aria-current="true"':""} data-go="${id}">${id}</button>`).join("");
      let body = "";
      if (surface === "command") {
        body = `<h2>Command</h2><p class="note">Work-package board. No ALL_DONE.</p>` + table(PACKAGES.map((p) => `<tr><td>${p.title}</td><td class="${p.status}"><span class="chip">${p.status}</span></td><td>${p.note}</td></tr>`).join(""));
      } else if (surface === "lyte") {
        body = `<h2>Lyte Forecast Loom</h2>${ribbon()}
          <p>Submit is CALLER_SUPPLIED, not MEASURED. Paste <code>true</code> fails closed.</p>
          <textarea id="loom-in" class="input" placeholder="paste envelope or true"></textarea>
          <p class="actions"><button type="button" id="loom-submit" class="btn btn-primary">Submit SAMPLE</button> <button type="button" id="loom-export" class="btn btn-secondary">Export canonical JSON</button></p>
          <p class="${loomMsg.includes("rejected")?"INCOMPLETE":"note"}" id="loom-msg">${loomMsg}</p>`;
      } else if (surface === "mesh") {
        const detail = meshCase ? DOUBLES.find((d) => d.id === meshCase) : null;
        body = `<h2>Mesh</h2><p class="note">Seven Forge #239 false ALIGNED doubles. A skipped sibling cannot ride a green parent.</p>` + table(DOUBLES.map((d) => `<tr><td><button type="button" class="btn btn-secondary case-btn" data-case="${d.id}">${d.title}</button></td><td class="${d.verdict}"><span class="chip">${d.verdict}</span></td><td>${d.detail}</td></tr>`).join(""));
        if (detail) body += `<p class="${detail.verdict}"><strong>Selected: ${detail.title}</strong> — ${detail.detail} observation_state INCOMPLETE_OR_DIVERGENT. production_authorization false.</p>`;
      } else if (surface === "frontier") {
        body = `<h2>Frontier lanes</h2>` + table(LANES.map((p) => `<tr><td>${p.title}</td><td class="${p.status}"><span class="chip">${p.status}</span></td><td>${p.note}</td></tr>`).join(""));
      } else {
        body = `<h2>Kernels</h2><p class="note">Native vs model-mirror kept distinct. No deletions.</p>` + table(KERNELS.map((p) => `<tr><td>${p.name} <span class="note">${p.kind}</span></td><td class="${p.status}"><span class="chip">${p.status}</span></td><td>${p.note}</td></tr>`).join(""));
      }
      if (palette) {
        body = `<div class="palette toolbar">${[...APPS, ...PACKAGES.map((p)=>p.id), ...DOUBLES.map((d)=>d.id)].map((id) => `<button type="button" class="btn btn-secondary" data-jump="${id}">${id}</button>`).join("")}</div>` + body;
      }
      document.getElementById("main").innerHTML = body;
      dock.querySelectorAll("[data-go]").forEach((n) => n.onclick = () => { surface = n.dataset.go; palette = false; render(); });
      document.querySelectorAll("[data-case]").forEach((n) => n.onclick = () => { meshCase = n.dataset.case; render(); });
      document.querySelectorAll("[data-jump]").forEach((n) => n.onclick = () => {
        const id = n.dataset.jump;
        if (APPS.includes(id)) surface = id;
        else if (DOUBLES.some((d) => d.id === id)) { surface = "mesh"; meshCase = id; }
        else surface = "command";
        palette = false; render();
      });
      const submit = document.getElementById("loom-submit");
      const exp = document.getElementById("loom-export");
      if (submit) submit.onclick = () => {
        const raw = document.getElementById("loom-in").value.trim();
        if (raw === "true" || raw === "false") {
          loomMsg = "numeric_boolean_rejected";
        } else {
          loomMsg = "CALLER_SUPPLIED accepted as SAMPLE inspect. Not MEASURED. Not Granite.";
        }
        render();
      };
      if (exp) exp.onclick = async () => {
        const payload = { schema: "szl.lyte.forecast-inspection-envelope/v1", series: SERIES, calibration: "NOT_ESTABLISHED", execution_authority: "NONE", label: "SAMPLE" };
        const text = JSON.stringify(payload);
        const digest = await sha256(text);
        loomMsg = `exported sha256 ${digest}`;
        const blob = new Blob([text], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "loom-sample.json";
        a.click();
        render();
      };
    }

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault(); palette = !palette; render();
      }
    });
    render();
  </script>
</body>
</html>
