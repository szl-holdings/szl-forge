[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-forge-inference"
version = "0.2.0"
description = "Proof-carrying SZL inference controller binding governed memory, formal formulas, Nemo witnesses, A11oy admission, and Anatomy observations."
readme = "INFERENCE-ARCHITECTURE.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "SZL Holdings" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2", "PyYAML>=6.0,<7", "huggingface-hub==2.1.1", "numpy==2.4.6", "requests==2.34.2", "cryptography==49.0.0"]

[tool.setuptools]
packages = ["inference", "model_candidates"]
include-package-data = false

[tool.setuptools.package-data]
inference = ["*.json"]
model_candidates = ["assets/szl/szl-design-system.css", "assets/szl/SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
