[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-forge-inference"
version = "0.2.0"
description = "Proof-carrying SZL inference controller binding governed memory, formal formulas, Nemo witnesses, A11oy admission, and Anatomy observations."
readme = "INFERENCE-ARCHITECTURE.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "SZL Holdings" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "build>=1.2,<2"]

[tool.setuptools]
packages = ["inference"]

[tool.setuptools.package-data]
inference = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
